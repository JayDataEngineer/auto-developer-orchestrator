version: "3"

vars:
  HARNESS: harness

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  sync:
    desc: Sync the Python harness (uv sync)
    dir: "{{.HARNESS}}"
    cmds:
      - uv sync

  test:
    desc: Run the harness pytest suite (no Docker, no tokens)
    dir: "{{.HARNESS}}"
    cmds:
      - uv run pytest -q

  contract:
    desc: Validate the declarative org contract (all 10 orgs green; no server)
    dir: "{{.HARNESS}}"
    cmds:
      - uv run python -m pux_harness.main --check-contract

  serve:
    desc: Start the Agent Protocol server (FastAPI on :9988)
    cmds:
      - pux serve

  sandbox:start:
    desc: Boot the Docker sandbox container (harness-owned; self-boots on first tool use anyway)
    cmds:
      - pux sandbox start

  sandbox:stop:
    desc: Stop + remove the Docker sandbox container
    cmds:
      - pux sandbox stop

  sandbox:status:
    desc: Show the running sandbox container (name/image/status/network/runtime)
    cmds:
      - pux sandbox status

  hooks:
    desc: Install pre-commit hooks (gitleaks secret scan)
    cmds:
      - bash scripts/setup-hooks.sh
