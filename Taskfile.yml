version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  sync:
    desc: Sync the orchestrator venv (uv sync; resolves pux-harness submodule dep)
    cmds:
      - uv sync

  test:
    desc: Run the pytest suite (no Docker, no tokens)
    cmds:
      - uv run pytest -q

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check .

  typecheck:
    desc: Run mypy type checker
    cmds:
      - uv run mypy .

  contract:
    desc: Validate the declarative org contract (all 10 orgs green; no server)
    cmds:
      - uv run pux check-contract

  serve:
    desc: Start the Agent Protocol server locally (Aegra dev on :9988; prod uses scripts/start_pux_aegra.sh)
    cmds:
      - cd pux-harness && uv run --extra prod aegra dev

  sandbox:start:
    desc: Boot the Docker sandbox container (harness-owned; self-boots on first tool use anyway)
    cmds:
      - pux sandbox start

  sandbox:stop:
    desc: Stop + remove the Docker sandbox container
    cmds:
      - pux sandbox stop

  sandbox:status:
    desc: Show the running sandbox container (name/image/status/network/runtime)
    cmds:
      - pux sandbox status

  hooks:
    desc: Install pre-commit hooks (gitleaks secret scan)
    cmds:
      - bash scripts/setup-hooks.sh
