# Auto-Developer Orchestrator — Taskfile
# https://taskfile.dev
#
# Usage:
#   task --list              show all tasks
#   task <name>              run a task
#   task model               start model server
#   task dev                 start dev environment

version: "3"

vars:
  GO_PORT: 3847
  JS_PORT: 5175
  MODELS_DIR:
    sh: echo "${MODELS_DIR:-/home/ubuntu/Documents/programs/shared-docker-infra/models/llm}"
  VISION_DIR:
    sh: echo "${VISION_DIR:-/home/ubuntu/Documents/programs/shared-docker-infra/models/vision}"
  LLAMA_IMAGE: "ghcr.io/ggml-org/llama.cpp:server-cuda"
  LLAMA_PORT: "8001"

dotenv: [".env"]

tasks:
  # ── Installation ────────────────────────────────────────────────────────
  install:
    desc: Install dependencies (npm, Go)
    cmds:
      - npm install --no-audit --no-fund
      - cmd: cd backend && go mod tidy
        ignore_error: true
      - echo "Done — all dependencies installed."

  # ── Build ──────────────────────────────────────────────────────────────
  build:
    desc: Build server and CLI binaries
    dir: backend
    vars:
      VERSION:
        sh: cat ../VERSION
    cmds:
      - go build -ldflags "-X github.com/auto-developer-orchestrator/backend/internal.Version={{.VERSION}}" -o server ./cmd/server/
      - go build -ldflags "-X github.com/auto-developer-orchestrator/backend/internal.Version={{.VERSION}}" -o orch ./cmd/cli/
      - echo "Built backend/server and backend/orch (v{{.VERSION}})"

  # ── Local Development ───────────────────────────────────────────────────
  dev:
    desc: Start Go backend + Vite frontend
    vars:
      VERSION:
        sh: cat VERSION
    cmds:
      - cmd: fuser -k {{.GO_PORT}}/tcp 2>/dev/null; fuser -k {{.JS_PORT}}/tcp 2>/dev/null; true
        ignore_error: true
        silent: true
      - cmd: cd backend && go build -ldflags "-X github.com/auto-developer-orchestrator/backend/internal.Version={{.VERSION}}" -o server ./cmd/server/
        desc: Build backend (catch compile errors before backgrounding)
      - cmd: cd backend && PROJECT_ROOT=$(pwd)/.. OPENSHELL_IMAGE=pux-sandbox:latest LANGFUSE_HOST=http://localhost:3100 LANGFUSE_PUBLIC_KEY=pk-orch-2026-lf-a1b2c3d4e5f6 LANGFUSE_SECRET_KEY=sk-orch-2026-lf-a1b2c3d4e5f6 ./server &
        ignore_error: true
      - cmd: npm run dev -- --port {{.JS_PORT }} &
        ignore_error: true
      - |
        for i in $(seq 1 30); do
          GO_UP=$(ss -tlnp 2>/dev/null | grep -c ":{{.GO_PORT}} " || true)
          VITE_UP=$(ss -tlnp 2>/dev/null | grep -c ":{{.JS_PORT}} " || true)
          if [ "$GO_UP" -ge 1 ] && [ "$VITE_UP" -ge 1 ]; then
            echo "Backend  http://localhost:{{.GO_PORT}}"
            echo "Frontend http://localhost:{{.JS_PORT}}"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "WARNING: services not ready after 30s (Go={{.GO_PORT}} Vite={{.JS_PORT}})"
          fi
          sleep 1
        done

  dev-frontend:
    desc: Start Vite frontend only
    cmds:
      - npm run dev -- --port {{.JS_PORT}}

  dev-backend:
    desc: Start Go backend only
    dir: backend
    cmds:
      - OPENSHELL_IMAGE=pux-sandbox:latest PROJECT_ROOT=$(pwd)/.. go run ./cmd/server/

  # ── CLI ─────────────────────────────────────────────────────────────────
  cli:
    desc: Run the orch CLI (pass extra args via CLI_ARGS)
    dir: backend
    cmds:
      - go run ./cmd/cli/ {{.CLI_ARGS}}

  chat:
    desc: Launch the interactive TUI (frontend/tui via bun)
    dir: frontend/tui
    cmds:
      - bun run src/main.tsx {{.CLI_ARGS}}

  code:
    desc: Launch TUI in code mode (current repo, DeepSeek V4 Flash)
    dir: frontend/tui
    cmds:
      - cmd: |
          curl -sf http://localhost:3847/api/projects 2>/dev/null | grep -q auto-developer-orchestrator || \
            curl -sf -X POST http://localhost:3847/api/projects/add \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"auto-developer-orchestrator\",\"path\":\"$(cd ../.. && pwd)\"}" 2>/dev/null || true
        silent: true
      - bun run src/main.tsx --project auto-developer-orchestrator --cwd ../.. --model deepseek/deepseek-v4-flash

  tui-visual:
    desc: Start TUI visual testing server (autonomous dev loop)
    vars:
      TUI_VENV: .venv/tui-visual
    cmds:
      - cmd: test -d {{.TUI_VENV}} || uv venv {{.TUI_VENV}}
        silent: true
      - cmd: "uv pip install --python {{.TUI_VENV}}/bin/python pyte Pillow 2>/dev/null; true"
        silent: true
      - cmd: "{{.TUI_VENV}}/bin/python scripts/tui_visual.py --port 9877 {{.CLI_ARGS}}"

  webui-visual:
    desc: Start WebUI visual testing server (Playwright + HTTP on :9878)
    vars:
      WEBUI_VENV: .venv/webui-visual
    cmds:
      - cmd: test -d {{.WEBUI_VENV}} || uv venv {{.WEBUI_VENV}}
        silent: true
      - cmd: "uv pip install --python {{.WEBUI_VENV}}/bin/python playwright Pillow 2>/dev/null; true"
        silent: true
      - cmd: "{{.WEBUI_VENV}}/bin/python -m playwright install chromium 2>/dev/null; true"
        silent: true
      - cmd: "{{.WEBUI_VENV}}/bin/python scripts/webui_visual.py --port 9878 {{.CLI_ARGS}}"

  # ── Docker Development ──────────────────────────────────────────────────
  up:
    desc: Start dev environment with hot reload (Docker)
    cmds:
      - task: down
      - docker compose -f infra/compose/docker-compose.dev.yml up -d --build
      - echo "Dev services started → http://orchestrator.local"

  down:
    desc: Stop everything — local dev, compose, sandboxes, model
    cmds:
      - cmd: fuser -k {{.GO_PORT}}/tcp 2>/dev/null; fuser -k {{.JS_PORT}}/tcp 2>/dev/null; true
        ignore_error: true
        silent: true
      - cmd: docker compose -f infra/compose/docker-compose.dev.yml down --remove-orphans 2>/dev/null; true
        ignore_error: true
        silent: true
      - cmd: docker compose -f infra/compose/docker-compose.yml down --remove-orphans 2>/dev/null; true
        ignore_error: true
        silent: true
      - cmd: docker rm -f orchestrator-llama 2>/dev/null; true
        ignore_error: true
        silent: true
      - cmd: docker ps -q --filter "name=orchestrator-" | xargs -r docker rm -f
        ignore_error: true

  restart:
    desc: Restart dev environment
    cmds:
      - task: down
      - task: up

  logs:
    desc: Follow all logs
    cmds:
      - docker compose -f infra/compose/docker-compose.dev.yml logs -f

  # ── Production ──────────────────────────────────────────────────────────
  prod-up:
    desc: Start production environment
    cmds:
      - docker compose -f infra/compose/docker-compose.yml up -d --build
      - echo "Production services started → http://orchestrator.local"

  prod-down:
    desc: Stop production environment (compose + dynamic sandboxes)
    cmds:
      - docker compose -f infra/compose/docker-compose.yml down
      - cmd: docker ps -q --filter "name=orchestrator-sandbox-" | xargs -r docker rm -f
        ignore_error: true

  # ── Testing ─────────────────────────────────────────────────────────────
  test:
    desc: Run all unit tests (Go + JS + TUI) in parallel, then E2E
    cmds:
      - task: test-go &
      - task: test-js &
      - task: test-tui &
      - wait
      - task: test-e2e
      - task: test-tui-e2e
      - task: test-webui-e2e

  test-go:
    desc: Run Go backend tests
    dir: backend
    cmds:
      - go test -count=1 ./...

  test-tui:
    desc: Run TUI vitest tests
    cmds:
      - npx vitest run --project tui

  test-cli:
    desc: Run Go CLI + TUI tests
    cmds:
      - task: test-go-cli
      - task: test-tui

  test-go-cli:
    desc: Run Go CLI tests only
    dir: backend
    cmds:
      - go test -count=1 ./internal/cli/...

  test-go-mcp:
    desc: Run MCP client tests
    dir: backend
    cmds:
      - go test -count=1 ./internal/mcp/...

  test-js:
    desc: Run frontend unit + component tests (no backend required)
    cmds:
      - npx vitest run

  test-integration:
    desc: Run real-backend Playwright tests (requires running backend + frontend)
    cmds:
      - npx playwright test --config=tests/playwright.config.ts --project=real {{.CLI_ARGS}}

  test-python:
    desc: Run Python E2E tests (all domains)
    dir: tests/python
    cmds:
      - python3 -m pytest -v --tb=short {{.CLI_ARGS}}

  test-python-api:
    desc: Run Python API tests only
    dir: tests/python
    cmds:
      - python3 -m pytest api/ -v --tb=short {{.CLI_ARGS}}

  test-python-sse:
    desc: Run Python SSE contract tests
    dir: tests/python
    cmds:
      - python3 -m pytest sse/ -v --tb=short {{.CLI_ARGS}}

  test-python-agent:
    desc: Run Python agent loop tests (requires LLM)
    dir: tests/python
    cmds:
      - python3 -m pytest agent/ -v --tb=short {{.CLI_ARGS}}

  test-python-browser:
    desc: Run Python browser automation tests
    dir: tests/python
    cmds:
      - python3 -m pytest browser/ -v --tb=short {{.CLI_ARGS}}

  test-python-desktop:
    desc: Run Python desktop automation tests
    dir: tests/python
    cmds:
      - python3 -m pytest desktop/ -v --tb=short {{.CLI_ARGS}}

  test-python-vision:
    desc: Run tests that use vision verification
    dir: tests/python
    cmds:
      - python3 -m pytest -v --tb=short -m vision {{.CLI_ARGS}}

  test-e2e:
    desc: Run Playwright E2E tests (mocked backend)
    cmds:
      - npx playwright test --config=tests/playwright.config.ts --project=mocked {{.CLI_ARGS}}

  test-tui-e2e:
    desc: Run TUI visual E2E tests (requires task tui-visual)
    dir: tests/python
    cmds:
      - python3 -m pytest tui/ -v --tb=short {{.CLI_ARGS}}

  test-webui-e2e:
    desc: Run WebUI E2E tests (Playwright with route mocking)
    dir: tests/python
    cmds:
      - python3 -m pytest frontend/test_webui_chat.py -v --tb=short {{.CLI_ARGS}}

  test-all:
    desc: Run all unit + E2E tests sequentially (CI mode)
    cmds:
      - task: test-go
      - task: test-js
      - task: test-tui
      - task: test-e2e
      - task: test-tui-e2e
      - task: test-webui-e2e

  # ── AI Test Suite (Pux Org) ─────────────────────────────────────────────
  test-ai:
    desc: |
      Run AI-powered test suite (generic Pux org).
        task test-ai                          run full regression
        task test-ai PROMPT="visual audit"    run specific test
        task test-ai PROMPT="smoke test"      quick health check
        task test-ai PROJECT=/path/to/proj    test a different project
    deps: [build]
    vars:
      TEST_PROJECT: '{{.PROJECT}}'
    cmds:
      - |
        PROMPT="{{.PROMPT}}"
        PROJECT="{{.TEST_PROJECT}}"
        [ -z "$PROMPT" ] && PROMPT="run full regression test on this project"
        # Default: test the orchestrator project itself (not the org dir)
        if [ -z "$PROJECT" ]; then
          PROJECT="{{.USER_WORKING_DIR}}"
        fi
        cd backend && ./orch agent prompt "$PROMPT" --org test-suite -p "$PROJECT"

  # ── Linting ─────────────────────────────────────────────────────────────
  lint:
    desc: Run all linters
    cmds:
      - cmd: cd backend && go fmt ./... && go vet ./...
      - npm run lint

  # ── Secret Scanning ──────────────────────────────────────────────────────
  hooks:
    desc: Install pre-commit gitleaks hook (idempotent + health-check)
    cmds:
      - cmd: |
          if ! command -v pre-commit >/dev/null 2>&1; then
            echo "ERROR: pre-commit not installed."
            echo "  Install one of:"
            echo "    pipx install pre-commit        (recommended)"
            echo "    pip install --user pre-commit"
            echo "    brew install pre-commit"
            exit 1
          fi
          pre-commit --version
      - pre-commit install
      - pre-commit install-hooks
      - cmd: |
          if [ ! -f .gitleaks-baseline.json ]; then
            echo "WARN: .gitleaks-baseline.json missing. Run 'task scan-secrets-baseline'."
          fi
      - cmd: echo "OK pre-commit hook installed at .git/hooks/pre-commit"
      - cmd: 'echo "    CI also scans; bypass locally with: git commit --no-verify"'

  scan-secrets:
    desc: Scan staged + working tree for secrets (does not write baseline)
    cmds:
      - cmd: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            echo "ERROR: gitleaks not installed. brew install gitleaks or see https://gitleaks.io"
            exit 1
          fi
      - gitleaks detect --source . --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --redact --no-banner

  scan-secrets-baseline:
    desc: Regenerate .gitleaks-baseline.json — REVIEW FINDINGS BEFORE COMMITTING
    cmds:
      - cmd: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            echo "ERROR: gitleaks not installed."
            exit 1
          fi
      - gitleaks detect --source . --config .gitleaks.toml --report-format json --report-path .gitleaks-baseline.json --no-banner
      - cmd: 'echo "Baseline regenerated: $(jq ''length'' .gitleaks-baseline.json 2>/dev/null || echo ''?'') findings marked as known."'
      - cmd: echo "REVIEW .gitleaks-baseline.json -- every entry should be intentional."

  # ── Transcript auditing ──────────────────────────────────────────────────
  audit:
    desc: Audit the most recent session against the Fable/Mythos six-pattern taxonomy
    cmds:
      - cmd: |
          LATEST=$(ls -t .pux/sessions/*.jsonl 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then echo "No sessions found in .pux/sessions/"; exit 1; fi
          echo "Auditing: $LATEST"
          python3 scripts/audit_transcript.py classify "$LATEST" --fast-only

  audit-summary:
    desc: Print the aggregate audit summary for the most recent session
    cmds:
      - cmd: |
          LATEST=$(ls -t .pux/sessions/*.jsonl 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then echo "No sessions found"; exit 1; fi
          python3 scripts/audit_transcript.py summary "$LATEST"

  test-eval-diligence:
    desc: Run the code-summary honesty eval (Fable/Mythos §5.2). Exits non-zero if dishonesty > 30%.
    cmds:
      - python3 tests/evals/diligence/test_code_summary_honesty.py --verbose

  # ── Sandbox images ───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  sandbox-build:
    desc: Build sandbox Docker image (standard = noVNC, lightweight)
    cmds:
      - docker build -t pux-sandbox:latest sandbox/

  sandbox-build-kasm:
    desc: Build sandbox Docker image with KasmVNC (H.264/WebRTC, low latency)
    cmds:
      - docker build --target kasm -t pux-sandbox:kasm sandbox/

  # ── Maintenance ─────────────────────────────────────────────────────────
  clean:
    desc: Remove build artifacts and all docker resources
    cmds:
      - rm -rf dist dist-web backend/bin backend/orch backend/server
      - docker compose -f infra/compose/docker-compose.dev.yml down -v --remove-orphans
      - cmd: docker compose -f infra/compose/docker-compose.yml down -v
        ignore_error: true
      - cmd: docker ps -aq --filter "name=orchestrator-sandbox-" | xargs -r docker rm -f
        ignore_error: true
      - echo "Clean complete."

  db-backup:
    desc: Backup SQLite database
    cmds:
      - mkdir -p data/backups
      - cp data/orchestrator.db "data/backups/orchestrator.db.backup_$(date +%Y%m%d_%H%M%S)"
      - echo "Database backed up → data/backups/"

  db-restore:
    desc: Restore SQLite database from backup (task db-restore BACKUP=<filename>)
    cmds:
      - ls -1 data/backups/
      - cp "data/backups/{{.BACKUP}}" data/orchestrator.db
      - echo "Database restored."
    requires:
      vars: [BACKUP]

  infra-check:
    desc: Check health of shared infrastructure
    cmds:
      - cmd: 'echo -n "Traefik:  " && (curl -sf http://traefik.local/ping > /dev/null && echo "OK" || echo "DOWN")'
        ignore_error: true
      - cmd: 'echo -n "LiteLLM:  " && (curl -sf http://litellm.local/health > /dev/null && echo "OK" || echo "DOWN (optional)")'
        ignore_error: true
      - cmd: 'echo -n "Langfuse: " && (curl -sf http://langfuse.local/ > /dev/null && echo "OK" || echo "DOWN (optional)")'
        ignore_error: true
      - cmd: 'echo -n "Langfuse (standalone): " && (curl -sf http://localhost:3100/ > /dev/null && echo "OK" || echo "DOWN (optional)")'
        ignore_error: true
      - cmd: 'echo -n "Evaluator: " && (curl -sf http://localhost:3100/api/public/scores -u "pk-orch-2026-lf-a1b2c3d4e5f6:sk-orch-2026-lf-a1b2c3d4e5f6" > /dev/null && echo "OK" || echo "DOWN")'
        ignore_error: true

  # ── Org Templating (Stage 3) ───────────────────────────────────────────
  org-build:
    desc: "Render org trees from org.toml + Jinja2 (Stage 3). Pass org names: `task org-build -- invest tech-noir`"
    cmds:
      - uv run --with jinja2 python3 scripts/org_build.py {{.CLI_ARGS}}

  org-build-check:
    desc: "Verify rendered org trees match checked-in (CI mode)"
    cmds:
      - uv run --with jinja2,pytest,pyyaml python3 scripts/org_build.py --check
      - uv run --with jinja2,pytest,pyyaml pytest scripts/test_org_build.py

  # ── llama.cpp Model Server ────────────────────────────────────────────
  model:
    desc: |
      Start llama.cpp server. Reads profiles from config/models.json.
        task model              default model, vision + thinking
        task model MODEL=qwen36 switch to Qwen 3.6
        task model FLAGS=fast   vision, no thinking
        task model FLAGS=text   text-only + thinking
        task model FLAGS=bare   text-only, no thinking
    deps: [model-down]
    cmds:
      - |
        # Read model profile from config/models.json
        PROFILE="{{.MODEL}}"
        [ -z "$PROFILE" ] && PROFILE=$(jq -r '.current' config/models.json 2>/dev/null)
        [ -z "$PROFILE" ] && PROFILE="gemma4"

        LLM=$(jq -r ".models.\"$PROFILE\".llm" config/models.json)
        MMPROJ=$(jq -r ".models.\"$PROFILE\".mmproj" config/models.json)
        ALIAS=$(jq -r ".models.\"$PROFILE\".alias" config/models.json)
        CTX=$(jq -r ".models.\"$PROFILE\".ctx_size" config/models.json)
        PARALLEL=$(jq -r ".models.\"$PROFILE\".parallel" config/models.json)
        CACHE_RAM=$(jq -r ".models.\"$PROFILE\".cache_ram" config/models.json)
        THINK=$(jq -r ".models.\"$PROFILE\".thinking" config/models.json)
        MMPROJ_RAM=$(jq -r ".models.\"$PROFILE\".mmproj_ram // false" config/models.json)
        LABEL=$(jq -r ".models.\"$PROFILE\".name" config/models.json)

        [ "$LLM" = "null" ] && { echo "ERROR: Model profile '$PROFILE' not found in config/models.json"; exit 1; }

        # Determine flags based on FLAGS var
        VISION=false
        ENABLE_THINKING=false
        case "{{.FLAGS}}" in
          bare)  VISION=false; ENABLE_THINKING=false;;
          text)  VISION=false; ENABLE_THINKING=true;;
          fast)  VISION=true;  ENABLE_THINKING=false;;
          *)     VISION=true;  ENABLE_THINKING=$THINK;;
        esac

        # Build docker volume mounts and llama-server args separately
        VISION_MOUNT=""
        MMPROJ_ARG=""
        if [ "$VISION" = "true" ] && [ "$MMPROJ" != "null" ]; then
          VISION_MOUNT="-v {{.VISION_DIR}}:/vision:ro"
          MMPROJ_ARG="--mmproj /vision/$MMPROJ"
        fi

        THINK_ARGS=""
        if [ "$ENABLE_THINKING" = "true" ]; then
          THINK_ARGS='--chat-template-kwargs {"enable_thinking":true}'
        fi

        CACHE_RAM_ARGS=""
        if [ "$CACHE_RAM" != "0" ] && [ "$CACHE_RAM" != "null" ]; then
          CACHE_RAM_ARGS="--cache-ram $CACHE_RAM"
        fi

        MMPROJ_RAM_ARGS=""
        if [ "$MMPROJ_RAM" = "true" ] && [ "$VISION" = "true" ]; then
          MMPROJ_RAM_ARGS="--override-tensor v.*=CPU"
        fi

        echo "Starting $LABEL..."
        echo "  model:    $LLM"
        echo "  vision:   $VISION ($MMPROJ)"
        echo "  thinking: $ENABLE_THINKING"
        echo "  ctx:      $CTX"
        echo "  mmproj:   $([ "$MMPROJ_RAM" = "true" ] && echo "RAM (saves VRAM)" || echo "VRAM")"

        docker run -d --name orchestrator-llama \
          --gpus all \
          --network shared-infra \
          -p {{.LLAMA_PORT}}:8001 \
          -v "{{.MODELS_DIR}}:/models:ro" \
          $VISION_MOUNT \
          {{.LLAMA_IMAGE}} \
          --model /models/$LLM \
          --alias $ALIAS \
          --port 8001 --host 0.0.0.0 \
          --jinja --flash-attn on \
          --ctx-size $CTX \
          $MMPROJ_ARG \
          $CACHE_RAM_ARGS \
          --cache-type-k q8_0 --cache-type-v q8_0 \
          --batch-size 512 --ubatch-size 512 \
          --cont-batching --parallel $PARALLEL --metrics \
          $MMPROJ_RAM_ARGS \
          $THINK_ARGS

        # Write current profile so Go backend can read it
        echo "{\"profile\":\"$PROFILE\",\"alias\":\"$ALIAS\",\"llm\":\"$LLM\"}" > /tmp/orchestrator-model.json
      - |
        echo "Waiting for model to load..."
        for i in $(seq 1 90); do
          if curl -sf "http://localhost:{{.LLAMA_PORT}}/health" > /dev/null 2>&1; then
            echo "Model ready on port {{.LLAMA_PORT}}"
            # Print TPS from health endpoint
            curl -sf "http://localhost:{{.LLAMA_PORT}}/health" | python3 -c "
        import json,sys
        d=json.load(sys.stdin)
        tps=d.get('timings',{}).get('predicted_per_second',0)
        print(f'  TPS: {tps:.1f} tokens/sec')
        " 2>/dev/null || true
            exit 0
          fi
          sleep 2
        done
        echo "ERROR: Model did not start within 180s"
        docker logs orchestrator-llama 2>&1 | tail -5
        exit 1

  model-down:
    desc: Stop the llama.cpp model server
    cmds:
      - cmd: docker rm -f orchestrator-llama 2>/dev/null; rm -f /tmp/orchestrator-model.json; true
        silent: true

  model-status:
    desc: Check model server health, TPS, and loaded model
    cmds:
      - cmd: |
          echo "=== Current profile ==="
          cat /tmp/orchestrator-model.json 2>/dev/null | python3 -m json.tool || echo "No model running"
          echo ""
          echo "=== Health ==="
          curl -sf http://localhost:{{.LLAMA_PORT}}/health | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          tps=d.get('timings',{}).get('predicted_per_second',0)
          ctx=d.get('tokens_evaluated',0)
          gen=d.get('tokens_predicted',0)
          print(f'  Status:   {d.get(\"status\",\"unknown\")}')
          print(f'  TPS:      {tps:.1f} tokens/sec')
          print(f'  Context:  {ctx} tokens evaluated')
          print(f'  Generated: {gen} tokens predicted')
          " 2>/dev/null || echo "Model server not running"
      - cmd: curl -sf http://localhost:{{.LLAMA_PORT}}/props | python3 -m json.tool 2>/dev/null || true
        silent: true

  model-list:
    desc: List available model profiles from config/models.json
    cmds:
      - cmd: |
          echo "Available models (config/models.json):"
          echo ""
          python3 -c "
          import json
          with open('config/models.json') as f:
              cfg = json.load(f)
          current = cfg.get('current','?')
          for k,v in cfg.get('models',{}).items():
              marker = ' ← current' if k == current else ''
              print(f'  {k:15s} {v[\"name\"]}{marker}')
              print(f'                  llm:    {v[\"llm\"]}')
              print(f'                  mmproj: {v[\"mmproj\"]}')
              print(f'                  ctx:    {v[\"ctx_size\"]}')
              print()
          print('Usage: task model MODEL=qwen36')

  # ── Release ───────────────────────────────────────────────────────────
  release:
    desc: "Bump version, commit, tag. Usage: task release VERSION=3.1.0"
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "Set VERSION. Example: task release VERSION=3.1.0"
      - sh: git diff --quiet
        msg: "Working tree dirty — commit or stash first."
    cmds:
      - cmd: echo "{{.VERSION}}" > VERSION
      - cmd: |
          sed -i 's/"version": ".*"/"version": "{{.VERSION}}"/' package.json
      - cmd: |
          cd frontend/tui && sed -i 's/"version": ".*"/"version": "{{.VERSION}}"/' package.json
        ignore_error: true
      - cmd: |
          cd frontend/shared && sed -i 's/"version": ".*"/"version": "{{.VERSION}}"/' package.json
        ignore_error: true
      - git add VERSION package.json frontend/tui/package.json frontend/shared/package.json
      - cmd: |
          git commit -m "release: v{{.VERSION}}"
      - cmd: |
          git tag "v{{.VERSION}}"
      - cmd: |
          echo "Released v{{.VERSION}} — push with: git push --follow-tags"
