version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  sync:
    desc: Sync the orchestrator venv (uv sync; deepagents 0.7.5 + deepagents-code 0.1.55, dcode's own pins)
    cmds:
      - uv sync

  test:
    desc: Run the pytest suite (no Docker, no tokens)
    cmds:
      - uv run pytest -q

  lint:
    desc: Run ruff linter (workspace core — src/ + tests/; infra/media-mcp is its own project)
    cmds:
      - uv run ruff check src/ tests/

  typecheck:
    desc: Run mypy type checker
    cmds:
      - uv run mypy src/

  emit:
    desc: Emit the union dcode surface (.deepagents/ + .mcp.json) at the project root
    cmds:
      - uv run pux sync

  check:
    desc: Drift-check the checked-in dcode surface (exit 1 on drift)
    cmds:
      - uv run pux check

  hooks:
    desc: Install pre-commit hooks (gitleaks secret scan)
    cmds:
      - bash scripts/setup-hooks.sh
