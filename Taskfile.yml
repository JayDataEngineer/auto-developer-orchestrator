version: "3"

vars:
  BIN: backend/mcpserver

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the MCP server binary (backend/mcpserver)
    dir: backend
    cmds:
      - go build -o ../{{.BIN}} ./cmd/mcpserver/

  run:
    desc: Build + run against $PWD (cd into your project first or set PUX_PROJECT_PATH)
    cmds:
      - task: build
      - "{{.BIN}} --addr 127.0.0.1:9876 --project ${PUX_PROJECT_PATH:-$PWD}"

  test:
    desc: Run Go unit tests
    dir: backend
    cmds:
      - go test -race ./...

  smoke:
    desc: Build + boot server + run smoke test against a temp workspace
    cmds:
      - task: build
      - mkdir -p /tmp/mcp-smoke
      - "echo 'hello world' > /tmp/mcp-smoke/test.txt"
      - |
        ./{{.BIN}} --addr 127.0.0.1:19876 --project /tmp/mcp-smoke &
        SERVER_PID=$!
        sleep 10
        python3 scripts/smoke_mcp.py
        EXIT=$?
        /bin/kill -TERM $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        exit $EXIT

  hooks:
    desc: Install pre-commit hooks (gitleaks secret scan)
    cmds:
      - bash scripts/setup-hooks.sh

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BIN}}
