# Production Docker Compose - High Performance Frontend + API
# Integrated with shared-docker-infra via Traefik
services:
  # ===========================================
  # Go Backend API Server (with Pi Agent)
  # ===========================================
  go-backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    container_name: orchestrator-go
    restart: always
    environment:
      - SERVER_PORT=3847
      - DATABASE_URL=/data/orchestrator.db
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - PROJECT_ROOT=/app/projects
      - PI_AGENT_DIR=/root/.pi
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse.local}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LITELLM_PROXY_URL=http://shared-traefik-1:80
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-e2e-test-master-key}
      - BROWSERLESS_URL=ws://orchestrator-browser:3000
      - GIT_CONFIG_GLOBAL=/tmp/.gitconfig
    volumes:
      - ./projects:/app/projects
      - ./data:/data
      - ./pi-config:/root/.pi
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
    networks:
      - shared-infra
    ports:
      - "3847:3847"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3847/api/health"]
      interval: 30s
      timeout: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator-api.rule=Host(`orchestrator.${INFRA_DOMAIN:-local}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.orchestrator-api.entrypoints=http"
      - "traefik.http.services.orchestrator-api.loadbalancer.server.port=3847"
      - "traefik.http.routers.orchestrator-api.priority=110"

  # ===========================================
  # React Frontend (Nginx Production)
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: orchestrator-frontend
    restart: always
    ports:
      - "3456:80"
    networks:
      - shared-infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`orchestrator.${INFRA_DOMAIN:-local}`)"
      - "traefik.http.routers.orchestrator.entrypoints=http"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=80"
      - "traefik.http.routers.orchestrator.priority=105"

  # ===========================================
  # Browserless (Headless Chrome for Web Sub-Agent)
  # ===========================================
  browserless:
    image: browserless/chrome:latest
    container_name: orchestrator-browser
    restart: always
    environment:
      - MAX_CONCURRENT_SESSIONS=2
      - SCREENSHOT_ENDPOINT=true
      - PREBOOT_CHROME=true
      - KEEP_ALIVE=true
    networks:
      - shared-infra

  # ===========================================
  # OpenShell Sandbox Manager (AI Agent Isolation)
  # ===========================================
  openshell-manager:
    image: nvidia/openshell:latest
    container_name: orchestrator-openshell
    restart: always
    privileged: false
    environment:
      # Sandbox policies
      - SANDBOX_POLICY=developer
      - NETWORK_ALLOW=github.com,api.anthropic.com,api.openai.com,api.openrouter.com,registry.hub.docker.com
      - FS_READONLY=/etc,/usr,/bin,/lib,/lib64
      - FS_READWRITE=/sandbox/workspace,/sandbox/tmp
      # Docker access for dependency caching (read-only socket)
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      # Project files
      - ./projects:/sandbox/workspace
      - ./openshell/policies:/etc/openshell/policies:ro
      - ./openshell/data:/sandbox/data
      # Docker socket for image caching (read-only, controlled via policy)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Temp directory
      - /tmp:/sandbox/tmp
    networks:
      - shared-infra
    ports:
      # Port range for desktop mode (VNC, CDP, noVNC)
      # Dynamically allocated by Go backend: 5901-5920 (VNC), 9222-9241 (CDP), 6081-6100 (noVNC)
      - "5901-5920:5901-5920"
      - "9222-9241:9222-9241"
      - "6081-6100:6081-6100"
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/docker.sock"]
      interval: 30s
      timeout: 10s
    # Security labels for OpenShell policy enforcement
    labels:
      - "openshell.policy=developer"
      - "openshell.cpu-limit=2.0"
      - "openshell.memory-limit=2048m"

networks:
  shared-infra:
    external: true
    name: ${SHARED_NETWORK_NAME:-shared-infra}
