<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Pux DnD E2E</title>
<style>
  body { font: 16px sans-serif; padding: 20px; }
  #log { white-space: pre-wrap; background:#111; color:#0f0; padding:10px; height:120px; overflow:auto; font-family:monospace;}
  .box { display:inline-block; width:120px; height:60px; border:2px solid #333; margin:8px; text-align:center; line-height:60px; vertical-align:middle; }
  #src { background:#cfe; }
  #dst { background:#fec; }
  #trigger { background:#eef; cursor:pointer; }
  #menu { display:none; background:#fee; padding:8px; margin:8px; }
  /* Custom slider widget (jQuery-UI / dnd-kit style) — a thumb whose position
     is driven by JS mouse handlers, NOT a native <input type=range>. This is
     what physics-drag (synthetic MouseEvent chain) is designed to move. */
  #track { position:relative; width:300px; height:30px; background:#eee; border:1px solid #999; margin:8px; }
  #thumb { position:absolute; left:0; top:0; width:30px; height:30px; background:#36c; cursor:grab; }
</style>
</head>
<body>
<div id="log"></div>

<h3>HTML5 drag-and-drop</h3>
<div id="src" class="box" draggable="true">Drag me</div>
<div id="dst" class="box">Drop here</div>

<h3>Custom slider widget (physics-drag target)</h3>
<div id="track"><div id="thumb"></div></div>
<span id="tval">left=0</span>

<h3>Hover-revealed menu</h3>
<div id="trigger" class="box">Hover me</div>
<div id="menu">MENU REVEALED</div>

<h3>Key capture</h3>
<input id="keys" type="text" placeholder="focus then press keys">
<span id="kreport"></span>

<script>
const log = document.getElementById('log');
const rec = s => { log.textContent += s + '\n'; };

// ---- HTML5 DnD listeners (mimics react-dnd / SortableJS consuming native events) ----
const src = document.getElementById('src');
const dst = document.getElementById('dst');
src.addEventListener('dragstart', e => {
  rec('dragstart fired; dataTransfer=' + (!!e.dataTransfer));
  try { e.dataTransfer.setData('text/plain', 'PAYLOAD'); } catch (err) { rec('setData threw: ' + err.message); }
});
dst.addEventListener('dragenter', e => { e.preventDefault(); rec('dragenter fired'); });
dst.addEventListener('dragover', e => { e.preventDefault(); rec('dragover fired'); });
dst.addEventListener('drop', e => {
  e.preventDefault();
  let payload = '(none)';
  try { payload = e.dataTransfer.getData('text/plain') || '(empty)'; } catch (err) { payload = 'getData threw: ' + err.message; }
  rec('drop fired; payload=' + payload);
});
src.addEventListener('dragend', () => rec('dragend fired'));

// ---- Custom slider thumb: moves on mousedown+mousemove (physics-drag target) ----
const thumb = document.getElementById('thumb');
const tval = document.getElementById('tval');
let dragging = false;
thumb.addEventListener('mousedown', e => { dragging = true; rec('thumb mousedown'); });
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const track = document.getElementById('track').getBoundingClientRect();
  let x = Math.max(0, Math.min(track.width - 30, e.clientX - track.left));
  thumb.style.left = x + 'px';
  tval.textContent = 'left=' + Math.round(x);
});
document.addEventListener('mouseup', () => { if (dragging) { dragging = false; rec('thumb mouseup'); } });

// ---- Hover menu ----
const trigger = document.getElementById('trigger');
const menu = document.getElementById('menu');
trigger.addEventListener('mouseenter', () => { menu.style.display = 'block'; rec('mouseenter fired → menu shown'); });
trigger.addEventListener('mouseover', () => rec('mouseover fired'));

// ---- Key capture ----
const keys = document.getElementById('keys');
keys.addEventListener('keydown', e => {
  document.getElementById('kreport').textContent += e.key;
  rec('keydown:' + e.key);
});
</script>
</body>
</html>
