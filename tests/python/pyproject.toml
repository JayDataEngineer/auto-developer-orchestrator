[project]
name = "auto-developer-e2e"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "requests>=2.32",
    "playwright>=1.49",
    "pytest-playwright>=0.6",
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
markers = [
    "api: REST API tests (no LLM)",
    "sse: SSE streaming tests",
    "sandbox: Sandbox management tests",
    "browser: Web browser automation tests",
    "desktop: Desktop automation tests (xdotool)",
    "agent: Agent loop tests (requires LLM)",
    "playwright: Playwright frontend UI tests",
    "slow: Slow tests (LLM-dependent)",
    "vision: Tests using vision/AI verification",
]
addopts = "-v --tb=short"
testpaths = ["."]
