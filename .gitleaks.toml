# Auto-Developer Orchestrator — gitleaks config
#
# Extends the built-in default rules. Adds allowlists for:
#   1. Test fixtures that must contain fake secrets (scrubber_test.go)
#   2. Demo/placeholder keys documented in markdown (Langfuse a1b2c3d4e5f6, LiteLLM sk-litellm-master)
#   3. The base64 "sample nonce" string used by sandbox demo code
#
# The .gitleaks-baseline.json file (generated by `task scan-secrets-baseline`)
# captures any historical findings (e.g. the purged Alpaca paper-trading keys in
# the invest-engine history) so pre-commit + CI only fail on NEW leaks.
#
# To inspect what gitleaks ships by default: gitleaks config --show

title = "auto-developer-orchestrator"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures, documented demo placeholders, and known-safe demo strings"

paths = [
  # Go scrubber tests must contain realistic-looking fake secrets to exercise the redactor.
  '''backend/internal/sensitive/scrubber_test\.go''',
  # Historical path before go-backend/ → backend/ rename.
  '''go-backend/internal/sensitive/scrubber_test\.go''',
  # Research notes / scratch memos are not production secrets.
  '''memos/.*\.md''',
]

regexes = [
  # Langfuse demo key placeholder used in Taskfile.yml, docker-compose.langfuse.yml, docs.
  '''a1b2c3d4e5f6''',
  # LiteLLM demo master key documented in docs/SHARED_INFRA_*.
  '''sk-litellm-master''',
  # base64 of the literal string "the sample nonce" — sandbox.go demo.
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]
