resolver 127.0.0.11 valid=10s ipv6=off;

# Map for conditional WebSocket upgrade (only upgrade when client requests it)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Go backend
    location /api/ {
        set $backend http://orchestrator-go-dev:3847;
        proxy_pass $backend;
        proxy_http_version 1.1;

        # SSE support: disable buffering so events stream in real-time
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;

        # WebSocket upgrade (only when requested)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
