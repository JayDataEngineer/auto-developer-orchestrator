[project]
name = "pux-harness"
version = "0.1.0"
description = "deepagents-based Pux harness (Phase 0 pivot spike)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents",
    "deepagents-acp>=0.0.8",
    "docker>=7.1.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain-openai",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pyyaml",
    "uvicorn[standard]>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pux_harness"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
