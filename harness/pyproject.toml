[project]
name = "pux-harness"
version = "0.1.0"
description = "deepagents-based Pux harness (Phase 0 pivot spike)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents",
    "langchain-openai",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pux_harness"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
