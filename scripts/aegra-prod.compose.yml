# Prod DB sidecars for the Aegra AP runtime (HOST-API topology).
#
# Aegra (OSS langgraph-api drop-in) is pux's free prod AP runtime, replacing
# server.py. This compose runs ONLY the persistence + broker sidecars; the Aegra
# API itself runs on the HOST via `aegra serve` (scripts/start_pux_aegra.sh),
# bound to the Tailscale IP. Rationale: matches the current prod topology
# (host process, Tailscale-bound) → reversible cutover (stop Aegra, restart
# server.py) and easy observability. The full-containerized form
# (`aegra up` — API in Docker too) remains the k3s-ready target.
#
# DBs bind 127.0.0.1 ONLY — never exposed to Tailscale/LAN (the host API is the
# only client). Replaces server.py's sqlite thread store with Postgres
# (persistence upgrade; existing ephemeral threads do not migrate — acceptable
# for Hermes/dev-bot per-conversation state). See AEGRA_PROD.md.
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: pux-aegra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pux_harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pux_harness_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pux_harness}
    ports:
      - "127.0.0.1:5432:5432"
    # NOTE: pg18 uses pg_ctlcluster and manages data in a version subdir, so the
    # mount is the PARENT /var/lib/postgresql (matching aegra's own compose), NOT
    # /var/lib/postgresql/data (which pg18 refuses to init). See AEGRA_PROD.md.
    volumes:
      - pux_aegra_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pux_harness}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pux-aegra-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - pux_aegra_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pux_aegra_pg:
  pux_aegra_redis:
