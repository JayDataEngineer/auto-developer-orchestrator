# Declarative sandbox policy for org social-media-pipeline.
# Cross-posts to Twitter + Telegram. Both sessions injected via env.

sandbox:
  tier: isolated

egress:
  allow:
    # Twitter
    - host: x.com
      port: 443
    - host: twitter.com
      port: 443
    - host: api.x.com
      port: 443
    - host: abs.twimg.com
      port: 443
    - host: pbs.twimg.com
      port: 443
    # Telegram
    - host: 149.154.167.91
      port: 443
    - host: api.telegram.org
      port: 443
    # Host-side SurrealDB — task_run persistence (resolved inside the container via host-gateway).
    - host: host.docker.internal
      port: 8000

credentials:
  required:
    - TWITTER_COOKIES_B64
    - TG_API_ID
    - TG_API_HASH
    - TELEGRAM_SESSION_B64

browser:
  cookies_env: TWITTER_COOKIES_B64
