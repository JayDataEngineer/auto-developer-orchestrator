# AUTO-GENERATED from org.toml — do not edit. Run `task org-build social-media-pipeline`.

services:
  social-media-pipeline-sandbox:
    image: pux-sandbox:latest
    runtime: runsc
    restart: unless-stopped
    # Labels that let Pux adopt this container instead of spinning up a
    # sibling. Bootstrap.sh exports OPENSHELL_PROJECT_PATH so the label
    # and the bind mount stay in sync — Pux's bash executor assumes
    # /sandbox/workspace maps to the project root.
    labels:
      openshell.org-name: "social-media-pipeline"
      openshell.project-path: "${OPENSHELL_PROJECT_PATH:-}"
      openshell.sandbox-id: "social-media-pipeline-compose"
      openshell.policy: "developer"
    volumes:
      # Canonical Pux mount — enables container reuse. When the env var
      # is unset, mounts the compose CWD (harmless default; Pux discovery
      # fails because the label is also empty, so no wrong adoption).
      - ${OPENSHELL_PROJECT_PATH:-./}:/sandbox/workspace
      - social-media-pipeline-workspace:/workspace
    environment:
      SURREALDB_URL: "http://localhost:8000/surreal"
      SURREALDB_NS: "research"
      SURREALDB_DB: "main"
      SURREALDB_USER: "root"
      SURREALDB_PASS: "root"
      PUX_ORG_PATH: "/sandbox/workspace"
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 256M
        limits:
          cpus: '1'
          memory: 1G
    network_mode: host

volumes:
  social-media-pipeline-workspace:
