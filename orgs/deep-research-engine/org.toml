# org.toml — Deep Research Engine
#
# Config-driven multi-agent research engine — data in, knowledge out, artifacts
# generated. CTO + 3 directors (research, ingestion, artifact).
#
# Pipeline code lives in ~/Documents/programs/deep-research-engine/ — this org
# is the Pux-side charter only. Face/voice identity is handled by media-mcp
# (InsightFace + WeSpeaker + HDBSCAN).

name = "deep-research-engine"
description = "Config-driven multi-agent research engine — data in, knowledge out, artifacts generated"

manifesto = "MANIFESTO.md"
staff_root = "roles"
skills_dir = "skills"
data_dir = "data"

# Database connections for Go tools (graph_query, vector_search).
[databases.surrealdb]
url = "http://localhost:8000/surreal"
namespace = "research"
database = "main"
username = "root"
password_env = "SURREAL_PASSWORD"

# Sandbox setup — uploaded into the container at /sandbox/ on every init.
# host.docker.internal resolves to the docker bridge gateway (10.10.0.1) and
# lets the container reach host-bound services (SurrealDB behind Caddy on :8000).
# PUX_ORG_PATH points at the bind-mounted /sandbox/workspace so surreal_client.py
# can locate prompts/surreal_schema.sql via its _load_schema_sql() lookup.
[sandbox]
tier = "standard"
image = "pux-sandbox:latest"
restart = "unless-stopped"
runtime_class = "gvisor"
warm_pool = 1
init_files = [
  "@shared/clients/surreal_client.py",
  "sandbox/context_engine.py",
  "sandbox/vector_search.py",
  "sandbox/entity_extract.py",
  "sandbox/content_cluster.py",
  "sandbox/telegram_parser.py",
  "sandbox/face_client.py",
  "sandbox/audio_client.py",
  "sandbox/video_frames.py",
  "sandbox/neo4j_client.py",
]

[sandbox.resources.requests]
cpu = "500m"
memory = "512Mi"

[sandbox.resources.limits]
cpu = "2"
memory = "2Gi"

[[sandbox.volumes]]
type = "volume"
name = "deep-research-engine-workspace"
container = "/workspace"

[sandbox.env]
SURREALDB_URL = "http://host.docker.internal:8000/surreal"
SURREALDB_NS = "research"
SURREALDB_DB = "main"
SURREALDB_USER = "root"
SURREALDB_PASS = "root"
PUX_ORG_PATH = "/sandbox/workspace"
# MCP capability URLs (MEDIA_MCP_URL, WEB_MCP_URL) are NOT declared here —
# they're deployment-specific. The shared sandbox clients default to
# localhost; set the env vars here only when pointing at a non-local MCP.

[[roles]]
name = "artifact-director"
description = "Artifact Director — Takes research/ingestion output and produces final artifacts: reports, docs, llms.txt, podcasts, code. Selects the right writer for the format."
max_rounds = 20
model = "deepseek/deepseek-v4-flash"
imports = ["shell"]

[[roles]]
name = "auditor"
description = "Auditor — Peer worker that checks ingestion quality. Catches empty transcripts, sender-name pollution, all-Unknown senders, missing topic discovery, broken join tables. Returns gap report."
max_rounds = 20
model = "deepseek/deepseek-v4-flash"
imports = ["shell"]

[[roles]]
name = "ingestion-director"
description = "Ingestion Director — Manages multimodal data ingestion (structured exports, PDFs, audio, images). Delegates to specialized processors, reviews quality, builds knowledge structures."
max_rounds = 40
model = "deepseek/deepseek-v4-flash"
imports = ["shell"]

[[roles]]
name = "multimodal-worker"
description = "Multimodal Worker — Cross-modal person linking. Drives the lip-sync heuristic via face + voice + temporal reasoning. Resolves face clusters to voice clusters to canonical person nodes."
max_rounds = 30
model = "deepseek/deepseek-v4-flash"
imports = ["shell", "vision"]

[[roles]]
name = "pdf-ingestor"
description = "PDF Ingestor — extract structured knowledge from PDF files (text, tables, images, metadata). Returns findings the synthesizer can merge."
max_rounds = 20
model = "deepseek/deepseek-v4-flash"
imports = ["shell", "vision"]

[[roles]]
name = "research-director"
description = "Research Director — Plans research, delegates to web/RAG researchers, reviews quality, directs synthesis. No rigid graph — iterate until good enough."
max_rounds = 30
model = "deepseek/deepseek-v4-flash"
imports = ["shell"]

[[roles]]
name = "social-post-writer"
description = "Social Post Writer — Twitter/X threads, Mastodon, Bluesky posts from a cited brief. Adapts voice per platform, can self-verify claims."
max_rounds = 12
model = "deepseek/deepseek-v4-flash"
imports = ["shell", "research", "vision"]

[[roles]]
name = "substack-writer"
description = "Substack Writer — longform article from a cited brief. Section structure, narrative arc, footnoted citations, can self-verify."
max_rounds = 20
model = "deepseek/deepseek-v4-flash"
imports = ["shell", "research", "vision"]

[[roles]]
name = "synthesizer"
description = "Synthesizer — merge multiple research/ingestion outputs into a single cited brief. Resolves conflicts, flags uncertainty, can self-verify."
max_rounds = 15
model = "deepseek/deepseek-v4-flash"
imports = ["shell", "research", "vision"]

[[roles]]
name = "web-researcher"
description = "Web Researcher — search + scrape + summarize with citations, OCR images, cross-reference claims. Returns structured findings the synthesizer can merge."
max_rounds = 25
model = "deepseek/deepseek-v4-flash"
imports = ["research", "vision", "shell"]
