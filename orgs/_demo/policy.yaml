# Declarative sandbox policy for org _demo.
#
# Presence of policy.yaml opts this org into declarative enforcement.
# Five sections, all independent — uncomment the ones you want:
#
#   workspace        extra bind-mounts + run_as_host_user
#   egress           deny-by-default iptables ACL (resolved at boot)
#   credentials      env-only cred injection (validated, never on disk)
#   sandbox          image + tier overrides
#   browser          cookie pre-seed via base64 env (with seed-cookies.sh)
#
# Schema reference: backend/internal/policy/policy.go
# Behavior: backend/internal/sandbox/policy_hook.go + sandbox/scripts/apply-egress-policy.sh
#
# Enforcement skips TierBridged sandboxes (host networking makes
# iptables-in-container meaningless). For orgs that need X11 + host net,
# put host allowlists elsewhere (e.g. the host firewall).

# workspace:
#   mounts:
#     - host: ${PROJECT_ROOT}
#       container: /workspace/project
#       mode: rw                  # rw (default) or ro
#   run_as_host_user: true        # match container UID:GID to operator so
#                                 # writes to bind-mounts aren't root-owned

# egress:
#   allow:
#     - host: github.com          # DNS resolved at boot, all IPs allowed
#       port: 443
#     - host: api.alpaca.markets
#       port: 443
#     - host: 100.86.69.57        # literal IP also works (e.g. Tailscale)
#       ports: [18800, 18080, 18265]
#   # deny_default: true implied when allow non-empty.
#   # DNS (port 53) + established connections + loopback always allowed.

# credentials:
#   required:                     # refuse sandbox create if absent in env
#     - ALPACA_API_KEY
#     - ALPACA_SECRET_KEY
#   optional:                     # inject if present, silent skip otherwise
#     - FRED_API_KEY

# sandbox:
#   image: my-org-sandbox:latest  # override pux-sandbox:latest with a custom
#                                 # image (specialist deps — manim, kokoro,
#                                 # etc). Tag must exist locally or in the
#                                 # configured registry.
#   tier: isolated                # override the caller's networking tier.
#                                 # `isolated` (default Docker bridge) forces
#                                 # egress ACLs + container networking.
#                                 # `bridged` skips them (host net).

# browser:
#   cookies_env: TWITTER_COOKIES_B64
#                                 # Name of the env var carrying base64-encoded
#                                 # cookie JSON for the in-sandbox browser.
#                                 # Operator exports the var (typically via
#                                 # `<org>/bootstrap.sh --emit-env > env && source env`);
#                                 # Go validates present (required), injects
#                                 # into container env. Supervisord runs
#                                 # seed-cookies.sh at priority 80, which
#                                 # decodes the b64 + POSTs to sb_server.py's
#                                 # /cookies endpoint. Cookies NEVER touch disk
#                                 # inside the container. See
#                                 # orgs/twitter-agent/policy.yaml for a
#                                 # shipped example.
