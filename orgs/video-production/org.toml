# org.toml — Video Production
#
# Full-stack educational video production: research, storyboard, Manim/ffmpeg
# visuals, Kokoro TTS narration, QC, archival, delivery.

name = "video-production"
description = "Full-stack educational video production org — research, storyboard, Manim/ffmpeg visuals, Kokoro TTS narration, QC, archival, delivery"

manifesto = "MANIFESTO.md"
staff_root = "roles"
skills_dir = "skills"

[sandbox]
tier = "custom-build"
service_name = "video-producer"
container_name = "research-video-producer"
restart = "unless-stopped"
network_mode_disabled = true

[sandbox.build]
context = "."
dockerfile = "Dockerfile"
# Custom build required: Manim (LaTeX + Cairo), Kokoro TTS, ffmpeg system deps
# are too heavy for the pux-sandbox:latest base image. Build time ~6 min.
justification = "Manim + LaTeX + Kokoro TTS + ffmpeg system dependencies are too heavy for the stock pux-sandbox image; rendering requires system packages that pip alone cannot install."

[sandbox.env]
VIDEO_PRODUCTION_ROOT = "/workspace/video-productions"
KOKORO_VOICE = "af_heart"
KOKORO_LANG_CODE = "a"

[sandbox.healthcheck]
test = ["CMD", "python", "-c", "import sys; sys.exit(0)"]
interval = "30s"
timeout = "5s"
retries = 3
start_period = "120s"

# Bootstrap metadata — drives the rendered bootstrap.sh. Custom-build tier
# triggers `docker compose build` before `up`. Smoke test verifies the
# heavy system deps that the custom Dockerfile installs (Manim, LaTeX, ffmpeg).
[sandbox.bootstrap]
smoke_test_command = "python3 -c 'import manim; print(\"manim\", manim.__version__)' && ffmpeg -version >/dev/null 2>&1 && python3 -c 'from PIL import Image; print(\"pillow ok\")'"
smoke_test_description = "Manim + ffmpeg + Pillow available in container"

[[sandbox.bootstrap.hard_deps]]
name = "docker"
check = "command -v docker"
error_msg = "docker not found on PATH"

[[sandbox.bootstrap.hard_deps]]
name = "docker compose"
check = "docker compose version"
error_msg = "docker compose subcommand missing — install Docker Compose v2"

[[sandbox.volumes]]
type = "volume"
name = "video_prod_workspace"
docker_name = "research_video_prod_workspace"
container = "/workspace/video-productions"

[[roles]]
name = "video-producer"
description = "Video Producer — Full-stack educational video production: research, storyboard, Manim/ffmpeg visuals, Kokoro TTS narration, QC, archival, and delivery. Produces explainers, paper walkthroughs, lecture recaps, daily summaries."
max_rounds = 60
model = "deepseek/deepseek-v4-flash"
imports = ["shell", "filesystem"]
capabilities = ["web-search", "media-vision"]
