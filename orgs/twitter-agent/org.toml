# org.toml — Twitter Content Division
#
# Social media manager — content generation, engagement strategy, automated
# posting. Schedules: morning post (active), afternoon/engagement/weekly
# (disabled, available for re-enabling).

name = "twitter-agent"
description = "Social media manager — content generation, engagement strategy, automated posting"

manifesto = "MANIFESTO.md"
staff_root = "roles"
tool_packages_root = "tool_packages"
skills_dir = "skills"

[sandbox]
tier = "standard"
image = "pux-sandbox:latest"
restart = "unless-stopped"
runtime_class = "gvisor"
warm_pool = 1
init_files = [
  "@shared/sandbox/paths.py",
  "@shared/sandbox/twitter_session.py",
  "@shared/sandbox/twitter_helpers.py",
  "@shared/sandbox/twitter_post.py",
]
pip_packages = ["browser-cookie3", "requests", "tweepy"]

[sandbox.resources.requests]
cpu = "250m"
memory = "256Mi"

[sandbox.resources.limits]
cpu = "1"
memory = "1Gi"

[[sandbox.volumes]]
type = "volume"
name = "twitter-agent-workspace"
container = "/workspace"

[sandbox.env]
PUX_ORG_PATH = "/sandbox/workspace"

[[schedules]]
name = "morning_post"
cron = "0 8 * * *"
prompt = "prompts/morning_post.md"
role = "content-writer"
model = "deepseek/deepseek-v4-flash"
enabled = true

[[schedules]]
name = "afternoon_post"
cron = "0 13 * * *"
prompt = "prompts/afternoon_post.md"
role = "content-writer"
model = "deepseek/deepseek-v4-flash"
enabled = false

[[schedules]]
name = "engagement_check"
cron = "0 18 * * *"
prompt = "prompts/engagement_check.md"
role = "engagement-manager"
enabled = false

[[schedules]]
name = "weekly_strategy"
cron = "0 10 * * 1"
prompt = "prompts/weekly_strategy.md"
role = "researcher"
model = "deepseek/deepseek-v4-flash"
enabled = false

[[roles]]
name = "content-writer"
description = "Twitter content writer — drafts tweets, threads, and visual content"
imports = ["browser"]
tools = ["bash"]
mcp_servers = ["media-analysis"]
max_rounds = 15
temperature = 0.8
model = "deepseek/deepseek-v4-flash"

[[roles]]
name = "engagement-manager"
description = "Engagement manager — monitors mentions, replies to followers, posts content"
imports = ["browser"]
tools = ["bash"]
mcp_servers = ["media-analysis"]
max_rounds = 15
temperature = 0.5

[[roles]]
name = "researcher"
description = "Trend researcher — finds fitness/book trends, competitor analysis, content ideas"
imports = ["researcher"]
tools = ["bash"]
max_rounds = 20
temperature = 0.4
model = "deepseek/deepseek-v4-flash"
