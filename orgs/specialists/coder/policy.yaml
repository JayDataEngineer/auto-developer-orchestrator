# Declarative policy for the dev-bot org.
#
# dev-bot is the coding org (the Claude-Code-equivalent CTO). The sandbox layer
# treats "no policy" (NoPolicy) and "policy with empty sections" as IDENTICAL for
# execution — egress_rules() returns "" for both (no egress.conf staged → open),
# and resolve_tier() returns the "isolated" fallback for both. So this file's
# sole execution effect is the sandbox.deps install below.
#
# CU-4: the github MCP server moved to org.yaml ``capabilities:`` (kind: mcp) —
# policy ``tool_servers:`` is now a permanent contract failure. github is a
# stdio server forked HOST-SIDE by McpSessionManager (independent of container
# egress); its binary is bootstrapped from the GitHub release and its PAT maps
# from .env's GITHUB_TOKEN. Per-server isolation: a missing token or failed
# bootstrap logs ERROR + zero github tools; dev-bot still starts.

# Sandbox deps: auto-install the Python lint/format/type tools the
# RubricMiddleware grader runs IN-CONTAINER to evaluate code changes
# (flake8/pycodestyle/black/mypy) — without these the grader reports "lint
# tools not installed" and can never fully clear its lint criteria, so a
# correct task loops on needs_revision. ruff is pux's own linter; included so
# the agent + grader can use the modern fast path too. dev-bot is open-egress
# (no egress: section → no ACL staged → pypi reachable), so no allowlist needed.
# Installed at container create() time (sandbox.deps); warn-and-continue.
sandbox:
  deps:
    pip:
      - flake8
      - pycodestyle
      - black
      - mypy
      - ruff

# OPT-IN specialist surface for the supervisor (the CTO). The CTO carries
# ``python`` (``pux_sandbox_python``) for quick parse/sanity checks — and
# NOTHING else. Browser tools live on the ``web-agent`` subagent (which
# resolves its own tools against the FULL surface), NOT on the CTO. This is
# the anti-flood fix: before opt-in, every specialist (browser_*, desktop_*,
# media) leaked onto the CTO's own tool list even though it only ever
# delegates them.
tool_surface:
  groups: [code]

# Pre-run: warm the in-container SeleniumBase Chrome so the first browser tool
# call (dev-bot's `web-agent`) doesn't pay the SeleniumBase CDP-attach cold
# start — that latency is moved out of the LLM turn budget so it can't trip the
# 60s browser timeout (browser.py _BROWSER_TIMEOUT). sb_server runs in the base
# sandbox image (supervisord priority 70); this job polls /status then hits
# /warmup, which calls ensure(). Warn-and-continue: an unreachable sb_server is
# logged, not fatal (the agent then cold-starts on first use, as before).
jobs:
  - name: warmup_browser
    script: orgs/_shared/sandbox/warmup_browser.py
    timeout: 90
    description: "Pre-warm the in-container SeleniumBase Chrome (sb_server /warmup) so the first browser tool call skips cold-start latency"
