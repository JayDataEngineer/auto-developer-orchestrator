# Optional per-org harness profile (Phase 16 seam). Applied to the deepagents
# stack the harness compiles for this org — org-wide: the CTO system prompt AND
# every specialist subagent. See pux-harness/pux_harness/agent/profile.py for the
# schema + AGENTS.md (root) for the field reference.
#
# Dev-Bot is the Claude-Code-equivalent coding org. The suffix below carries
# the standing discipline to EVERY agent in the org (CTO + dev-bot-explorer):
# voice, verify-or-die, and the never-retry-twice error-recovery rule.

system_prompt_suffix: |
  Voice: terse. No filler, no "Great question!", no restating the task back at
  length. Deliverable-first — return the answer, not a log of how you got there.

  Verify or die: run it, watch the output, reason about the result. "Should
  work" is banned. A claim of success without a cited command + exit code (or a
  read-back of the file) is not a claim you are allowed to make.

  Error recovery: NEVER retry the same edit or command more than twice. After 3
  failures on one step, stop and ESCALATE to the operator with what you tried +
  the exact errors. A loud failure beats a silent fallback.

  Never edit code you haven't read. No speculative refactors. No "also fix" —
  only the change that was asked for.

# Phase 1 — own the general-purpose subagent. deepagents auto-adds a HEAVY
# default ``general-purpose`` worker to EVERY graph unless the org opts out.
# Dev-Bot's specialists (dev-bot-explorer + the coding rubric gate below) ARE
# the surface — a generic catch-all worker would dilute delegation and ship the
# wrong (host-filesystem, non-coding) tool set. ``enabled: false`` makes the
# harness emit a NEUTERED slot (no tools, an honest "disabled" description) so
# the task menu shows a dead entry rather than a live generic worker that
# silently does off-roster work. See pux-harness/pux_harness/agent/orgs.py
# ``_build_general_purpose_sub`` (Safeguard S1) + the
# ``dev-bot-disables-general-purpose`` contract rule.
general_purpose_subagent:
  enabled: false

# Phase 17.B — the RubricMiddleware verify-gate. After the CTO finishes, a
# separate grader runs the `default` rubric below against the change using
# sandbox tools (run tests, read the diff, grep for regressions) and returns a
# verdict: satisfied / needs_revision / max_iterations_reached / failed /
# grader_error. The agent revises until satisfied or max_iterations is hit.
# This IS the tester + reviewer — one non-skippable gate, not a subagent the
# CTO might skip.
#
# The grader's model is resolved by role (Phase 17.B.0): `get_model(role="grader",
# org="dev-bot")`. It defaults to mimo-v2.5 (cheap/fast — right for a gate that
# runs up to ×max_iterations per deliverable). To upgrade this org's grader to
# the heavy reasoning model, set a top-level `models:` map:
#   models:
#     grader_model: glm-5.2     # the heavy/slow reasoning model
# Leave it absent to inherit the shipped default.
#
# `default` is injected at invoke time when the operator gives no `--rubric`.
# Per-org opt-in: only orgs that add this block get the gate; everything else
# is byte-identical to today. Disable by flipping `enabled: false`.
rubric:
  enabled: true
  max_iterations: 3
  default: |
    Grade whether the change is SHIPPABLE. Use the grader tools to gather
    evidence before the verdict — run the test suite, read the diff, grep for
    regressions — do NOT grade from the agent's summary alone. The agent fails
    this gate by default; only mark `satisfied` when EVERY clause is proven.
    - The change is implemented, not just described: the files exist and
      compile / typecheck clean (run it; cite the command + exit code).
    - The full pre-existing test suite passes (run it; cite command + exit code).
    - New behavior has tests, and they pass.
    - Lint / format is clean for the touched files.
    - No out-of-scope changes, no speculative refactors; the diff reads like the
      surrounding code.
    - The deliverable is a concise summary (what changed, how verified), not a
      play-by-play.
