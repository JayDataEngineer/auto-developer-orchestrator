# Declarative sandbox policy for org social-media-pipeline.
# Cross-posts to Twitter + Telegram. Twitter cookies are extracted host-side by
# the host_setup hook (flatpak Brave) → TWITTER_COOKIES_B64 → seeded into the
# in-sandbox browser at boot. Telegram creds (API ID/hash + session string) are
# operator-provided. Both sessions injected via env.

sandbox:
  tier: isolated

host_setup:
  # Extract Twitter cookies from the host's flatpak Brave on the host BEFORE
  # create() (cookie DB + keyring unreachable from the container). stdout →
  # TWITTER_COOKIES_B64. Same shared helper twitter-agent uses (orgs/_shared).
  - name: extract_twitter_cookies
    helper_script: orgs/_shared/sandbox/extract_browser_cookies.py
    python_deps: [browser-cookie3, pycryptodome, jeepney]
    args: [--browser, brave, --domain, x.com, --b64]
    exports:
      TWITTER_COOKIES_B64: stdout

egress:
  allow:
    # Twitter
    - host: x.com
      port: 443
    - host: twitter.com
      port: 443
    - host: api.x.com
      port: 443
    - host: abs.twimg.com
      port: 443
    - host: pbs.twimg.com
      port: 443
    # Telegram
    - host: 149.154.167.91
      port: 443
    - host: api.telegram.org
      port: 443
    # Host-side SurrealDB — task_run persistence (resolved inside the container via host-gateway).
    - host: host.docker.internal
      port: 8000

credentials:
  required:
    - TWITTER_COOKIES_B64
    - TG_API_ID
    - TG_API_HASH
    - TELEGRAM_SESSION_B64

browser:
  cookies_env: TWITTER_COOKIES_B64
