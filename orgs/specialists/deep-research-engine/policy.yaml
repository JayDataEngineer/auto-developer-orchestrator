# Declarative sandbox policy for org deep-research-engine.
#
# Bridge + egress allowlist. All upstream deps are host-side services managed
# by `make infra` (docker-compose.infra.yml) — reached inside the sandbox via
# host.docker.internal:
#
#   1. Host-side media-mcp (port 8101) — Parakeet ASR + Pyannote diarization +
#      face/video analysis. Built from infra/media-mcp submodule. This is what
#      audio_client.py hits (MEDIA_MCP_URL=http://localhost:8101 default).
#
#   2. Host-side SurrealDB (port 8000) — the shared knowledge graph
#      (namespace: research, database: main). Persists across runs — query it
#      to resume research or check what's already ingested.
#
# LLM: the sandbox scripts (entity_extract / content_cluster / context_engine)
# are DUMB CONSUMERS. They read LLM_API_URL / LLM_MODEL / LLM_API_KEY from the
# environment and do NOT re-resolve the provider, model, or key. The single
# `sandbox.llm: worker` declaration below triggers the harness to:
#
#   1. Resolve the role → models.yaml tier (default → worker_model = mimo-v2.5)
#   2. Resolve the model → provider (opencode-go, kind: openai)
#   3. Inject LLM_API_URL / LLM_MODEL into the sandbox env
#   4. Inject LLM_API_KEY from the provider's api_key_env (OPENCODE_API_KEY)
#   5. Auto-allow the provider host (opencode.ai:443) in the egress rules
#
# This is the SHARED PATTERN: orgs declare a role, the harness owns resolution.
# To repoint DRE at a different model, change the tier in models.yaml (ONE
# place) — no policy.yaml edits, no script edits, no key-chain edits.

sandbox:
  tier: isolated
  # `llm: worker` — resolve from models.yaml's default tier worker_model
  # (mimo-v2.5 via opencode-go). Cheap (~$0.001/call), multimodal, the right
  # size for entity extraction / clustering / synthesis. The harness injects
  # LLM_API_URL + LLM_MODEL + LLM_API_KEY and auto-allows opencode.ai:443.
  llm: worker
  # Static config for host-side infra started by `make infra`. These are NOT
  # secrets (no auth tokens) — just the URLs the sandbox needs to reach the
  # host-side services via the docker gateway. Secrets belong in credentials.
  env:
    # Direct SurrealDB (no /surreal Caddy prefix — that's for the proxy setup).
    # The sandbox reaches the host via host.docker.internal (the docker
    # gateway, mapped in container.py via extra_hosts).
    SURREALDB_URL: "http://host.docker.internal:8000"
    SURREALDB_NS: "research"
    SURREALDB_DB: "main"
    # media-mcp (Parakeet ASR + Pyannote + vision) on host port 8101.
    MEDIA_MCP_URL: "http://host.docker.internal:8101"
    # Embeddings: microsoft/harrier-oss-v1-0.6b loads in-process via
    # sentence-transformers (sandbox/embed.py). No EMB_URL — the model is a
    # Python dep, not a service. 1024-dim, MTEB v2 69.0, 94 languages.
    EMBED_MODEL_ID: "microsoft/harrier-oss-v1-0.6b"

egress:
  allow:
    # Host-side media-mcp (Parakeet ASR, Pyannote, face/video) — started by
    # `make infra`. Resolved inside the container via host-gateway.
    - host: host.docker.internal
      port: 8101
    # Host-side SurrealDB — the knowledge graph.
    - host: host.docker.internal
      port: 8000
    # Source pulls for research ingest.
    - host: github.com
      port: 443
    # NOTE: opencode.ai:443 is auto-allowed by `sandbox.llm: worker` above —
    # the harness resolves the provider host from models.yaml and appends it
    # to the egress rules. No need to mirror it here.

credentials:
  optional:
    - COMPREFACE_API_KEY    # face recognition (face_client.py)

jobs:
  # `when:` is a shell predicate (exit 0 -> run, non-zero -> skip). Each job
  # only fires when its input is staged in data/, so the org runs cleanly with
  # OR without pre-provided media — a seamless optional pre-run capability.
  - name: diarize_audio
    script: orgs/specialists/deep-research-engine/sandbox/audio_client.py
    args: [batch, --input, /sandbox/workspace/data, --output, /sandbox/workspace/artifacts/audio]
    when: "ls /sandbox/workspace/data/*.{mp3,wav,ogg,m4a,flac,webm,aac} 2>/dev/null | head -1"
    timeout: 7200
    description: "Diarize + transcribe all audio files via media MCP (Parakeet + Pyannote 3.1)"
  - name: process_video
    script: orgs/specialists/deep-research-engine/sandbox/video_frames.py
    args: [process, --input, /sandbox/workspace/data]
    when: "ls /sandbox/workspace/data/*.{mp4,mov,mkv,webm,avi,m4v} 2>/dev/null | head -1"
    timeout: 3600
    description: "Extract frames + narrate video files"
  - name: extract_entities
    script: orgs/specialists/deep-research-engine/sandbox/entity_extract.py
    args: [--input, /sandbox/workspace/data]
    when: "ls /sandbox/workspace/data/*.{txt,md,json} 2>/dev/null | head -1"
    timeout: 1800
    description: "Extract named entities from all text content"
