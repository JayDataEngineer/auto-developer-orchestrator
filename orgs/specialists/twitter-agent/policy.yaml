# Declarative sandbox policy for org twitter-agent.
# Drops host networking in favor of bridge + egress allowlist for x.com.
# Cookies are extracted host-side by the host_setup hook (flatpak Brave),
# base64'd into TWITTER_COOKIES_B64, and seeded into the in-sandbox browser at
# boot by the seed-cookies supervisor. One mechanism — no operator
# `bootstrap.sh --emit-env`.

sandbox:
  tier: isolated

host_setup:
  # Extract Twitter cookies from the host's flatpak Brave on the host BEFORE
  # create() (the cookie DB + GNOME keyring are unreachable from inside the
  # container). stdout → TWITTER_COOKIES_B64, consumed by credentials/browser
  # below unchanged. Cached venv at <project>/.pux/venvs/extract_twitter_cookies/.
  - name: extract_twitter_cookies
    helper_script: orgs/_shared/sandbox/extract_browser_cookies.py
    python_deps: [browser-cookie3, pycryptodome, jeepney]
    args: [--browser, brave, --domain, x.com, --b64]
    exports:
      TWITTER_COOKIES_B64: stdout

egress:
  allow:
    # Twitter main + image CDN + API endpoints all resolve under x.com / twitter.com
    - host: x.com
      port: 443
    - host: twitter.com
      port: 443
    - host: api.x.com
      port: 443
    - host: abs.twimg.com
      port: 443
    - host: pbs.twimg.com
      port: 443

credentials:
  required:
    - TWITTER_COOKIES_B64

browser:
  cookies_env: TWITTER_COOKIES_B64

# Pre-run: warm the in-container SeleniumBase Chrome so the first browser tool
# call doesn't pay the SeleniumBase CDP-attach cold start. sb_server runs in the
# base sandbox image (supervisord priority 70); this job polls /status then hits
# /warmup. Warn-and-continue: an unreachable sb_server is logged, not fatal.
jobs:
  - name: warmup_browser
    script: orgs/_shared/sandbox/warmup_browser.py
    timeout: 90
    description: "Pre-warm the in-container SeleniumBase Chrome (sb_server /warmup) so the first browser tool call skips cold-start latency"
