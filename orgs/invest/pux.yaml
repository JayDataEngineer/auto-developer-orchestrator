# Pux Org Manifest — Investment Bot
name: invest
description: "Market analysis and Alpaca paper trading — technical + fundamental analysis, regime detection, risk-aware execution"

manifesto: MANIFESTO.md
staff_root: roles

# Scheduled scans — actual code (fetch_data.py, trade.py, backtest.py, etc.)
# lives in ~/Documents/programs/dev/invest/ — this org is the Pux-side charter
# only (CTO + 3 directors: research, risk, execution).
schedules:
  - name: morning_scan
    cron: "30 9 * * 1-5"
    prompt: prompts/morning_scan.md
    role: research-director
    model: deepseek/deepseek-v4-flash
    enabled: true

  - name: midday_review
    cron: "0 13 * * 1-5"
    prompt: prompts/portfolio_review.md
    role: research-director
    model: deepseek/deepseek-v4-flash
    enabled: true

  - name: eod_scan
    cron: "30 15 * * 1-5"
    prompt: prompts/morning_scan.md
    role: research-director
    model: deepseek/deepseek-v4-flash
    enabled: true
