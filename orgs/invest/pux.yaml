# AUTO-GENERATED from org.toml — do not edit. Run `task org-build invest`.
name: invest
description: Multi-asset investment org — stocks + crypto + macro context via Alpaca paper trading. Multi-signal fusion with risk-aware execution and prediction journaling.
manifesto: MANIFESTO.md
staff_root: roles
skills_dir: skills
schedules:
  - name: morning_scan
    cron: "30 9 * * 1-5"
    prompt: "prompts/morning_scan.md"
    role: research-director
    model: deepseek-chat
    enabled: true
  - name: midday_review
    cron: "0 13 * * 1-5"
    prompt: "prompts/portfolio_review.md"
    role: research-director
    model: deepseek-chat
    enabled: true
  - name: eod_scan
    cron: "30 15 * * 1-5"
    prompt: "prompts/morning_scan.md"
    role: research-director
    model: deepseek-chat
    enabled: true
  - name: eod_snapshot
    cron: "0 16 * * 1-5"
    prompt: Run portfolio_status to check the current state, then record it
    role: execution-manager
    model: deepseek-chat
    enabled: true
  - name: eod_metrics
    cron: "30 16 * * 1-5"
    prompt: Run the metrics tool to collect today's portfolio metrics for Langfuse tracking
    role: execution-manager
    model: deepseek-chat
    enabled: true
  - name: crypto_hourly
    cron: "7 * * * *"
    prompt: "prompts/crypto_hourly.md"
    role: research-director
    model: deepseek-chat
    enabled: true
  - name: macro_weekly
    cron: "0 19 * * 0"
    prompt: "prompts/macro_weekly.md"
    role: research-director
    model: deepseek-chat
    enabled: true
sandbox:
  image: invest-sandbox:latest
  runtime_class: runc
  warm_pool: 1
  mode: contained
  env:
    ALPACA_API_KEY: "${ALPACA_API_KEY:-}"
    ALPACA_SECRET_KEY: "${ALPACA_SECRET_KEY:-}"
    FRED_API_KEY: "${FRED_API_KEY:-}"
  volumes:
    - type: bind
      host: ./sandbox
      container: /workspace/sandbox
    - type: bind
      host: ./config
      container: /workspace/config
    - type: volume
      name: invest-data
      container: /workspace/data
    - type: volume
      name: invest-cache
      container: /workspace/workspace/cache
