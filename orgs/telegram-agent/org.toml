# org.toml — Telegram Notes & Automation
#
# Personal Telegram automation — post to Saved Messages, read mentions, send
# messages without ever opening the app.

name = "telegram-agent"
description = "Personal Telegram automation — post to Saved Messages, read mentions, send messages without ever opening the app"

manifesto = "MANIFESTO.md"
staff_root = "roles"
skills_dir = "skills"

[sandbox]
image = "pux-sandbox:latest"
runtime_class = "gvisor"
warm_pool = 1
init_files = [
  "@shared/sandbox/telegram_session.py",
  "@shared/sandbox/telegram_helpers.py",
]
pip_packages = ["telethon", "requests"]

[sandbox.resources.requests]
cpu = "250m"
memory = "256Mi"

[sandbox.resources.limits]
cpu = "1"
memory = "1Gi"

[[sandbox.volumes]]
type = "volume"
name = "telegram-agent-workspace"
container = "/workspace"

[sandbox.env]
PUX_ORG_PATH = "/sandbox/workspace"

[[roles]]
name = "personal-assistant"
description = "Personal assistant — Telegram notes, mentions, and messaging via agent-written scripts"
imports = []
tools = ["bash", "python"]
max_rounds = 12
temperature = 0.4
model = "deepseek/deepseek-v4-flash"
