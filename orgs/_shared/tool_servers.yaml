# Shared catalog of foreign MCP tool servers.
# Schema: {name: {kind, transport, url (sse/http) or command (stdio),
#                headers?, tools? (allowlist), credentials?}}
#
# An org opts in via policy.yaml tool_servers: [name, ...] and may narrow
# tools: per entry. The schema + env-injection rules are documented inline
# per entry below.
#
# URLs are NOT hardcoded here — every endpoint is deployment-specific
# (Tailscale IP, cloud hostname, localhost) and must be injected via a
# `${VAR}` placeholder resolved from the operator's env at load time. The
# offline contract validates these structurally (the field is declared); the
# runtime path fails loud if a var is unset, and McpSessionManager.open() then
# logs ERROR + contributes zero tools for that server (per-server isolation —
# one unset var can't brick the org). Set the documented PUX_MCP_* vars in
# your shell / env manager before `pux serve|acp|direct`.

# ── ray_inference (Ray in-tree MCP) ──────────────────────────────────────────
# Source: this stack — server/mcp_inference.py in the Ray repo.
# In-tree FastMCP server mounted into Ray's Starlette app at /mcp/ray. Three
# self-describing tools (list_models, describe_model, generate) sourced live
# from Ray's /v1/form-spec. Zero hardcoded model knowledge — when Ray's
# catalog adds a model, this MCP exposes it automatically.
# This is the shared schema layer between Ray and every agent runtime
# (see ~/Pux/docs/thin-architecture.md).
ray_inference:
  kind: mcp
  transport: http
  url: ${PUX_MCP_RAY_URL}
  tools: [list_models, describe_model, generate]
  # Env: PUX_MCP_RAY_URL — the Streamable-HTTP MCP endpoint of the Ray
  # inference server. Local dev: http://localhost:33080/mcp/ray/
  # Remote (Tailscale): https://<tailnet-host>/mcp/ray/ (if served).

# ── web_research (research-mcp) ──────────────────────────────────────────────
# Source: https://github.com/JayDataEngineer/research-mcp
# Docker Compose service — no standalone binary; deploy via the repo's compose file.
web_research:
  kind: mcp
  transport: http
  url: ${PUX_MCP_WEB_RESEARCH_URL}
  # allowlist verified against the LIVE server's tools/list (17 tools total;
  # only the read-only research trio is armed — search/fetch/research). The
  # server exposed `scrape` at original pinning, renamed to `fetch` upstream.
  #
  # `fetch` was enhanced to return IMAGES + other file kinds, not just markdown:
  #   - method: httpx | crawl4ai | selenium | pdf (force a scraper; auto-learned
  #     per-domain when omitted). crawl4ai/selenium render JS; pdf extracts PDFs.
  #   - text_only (default false): images are ON by default for crawl4ai — set
  #     true to drop them for speed when only text matters.
  #   - css_selector: targeted content extraction.
  # langchain-mcp-adapters 0.3.0 converts MCP image/file content items into
  # LangChain ImageContentBlock/FileContentBlock in the ToolMessage, so a
  # multimodal base (e.g. mimo-v2.5) ingests fetched images directly — no
  # custom converter needed. Text-only bases see the markdown + alt-text.
  # Env: PUX_MCP_WEB_RESEARCH_URL — the Streamable-HTTP endpoint of the
  # research-mcp server (e.g. http://<host>:41827/mcp or via Tailscale Serve).
  tools: [search, fetch, research]

# ── media (media-mcp) ────────────────────────────────────────────────────────
# Source: https://github.com/JayDataEngineer/media-mcp
# Docker Compose service — no standalone binary; deploy via the repo's compose file.
media:
  kind: mcp
  transport: sse
  url: ${PUX_MCP_MEDIA_URL}
  # Env: PUX_MCP_MEDIA_URL — the SSE endpoint of the media-analysis MCP server
  # (vision/audio/video tools), e.g. http://<host>:41721/mcp or via Tailscale Serve.

# ── surreal (SurrealDB built-in MCP) ─────────────────────────────────────────
# Source: SurrealDB 3.1+ includes a first-party MCP server at /mcp.
# No external package needed — the endpoint is on the existing SurrealDB port.
# Exposes: query, select, create, insert, upsert, update, delete, relate, info,
# list, use, run. Schema auto-discovery via surrealdb://schema/* resources.
surreal:
  kind: mcp
  transport: http
  url: ${PUX_MCP_SURREAL_URL}
  headers:
    surreal-ns: research
    surreal-db: main
    Authorization: "Basic ${PUX_MCP_SURREAL_AUTH}"
  # Env: PUX_MCP_SURREAL_URL — the MCP endpoint (http://localhost:8000/mcp for
  # local `make infra`).
  # Env: PUX_MCP_SURREAL_AUTH — base64(user:pass), e.g. cm9vdDpyb290 for root:root.

# ── equibles-mcp (Equibles) ─────────────────────────────────────────────────
# Source: https://github.com/daniel3303/Equibles
# Docker Compose service — SEC filings, institutional holdings, insider trading,
# congressional trades, short data, economic indicators, stock prices.
# No standalone binary; deploy via the repo's compose file.
equibles:
  kind: mcp
  transport: http
  url: ${PUX_MCP_EQUIBLES_URL}
  # Env: PUX_MCP_EQUIBLES_URL — the HTTP endpoint of the Equibles MCP server
  # (e.g. http://<host>:8081/mcp). Requires FINRA + FRED API keys for full data.

# ── github (github-mcp-server) ───────────────────────────────────────────────
# Source: https://github.com/github/github-mcp-server
# Stdio binary — bootstrap fallback downloads from GitHub releases when not on PATH.
github:
  kind: mcp
  transport: stdio
  command: github-mcp-server
  args: [stdio]
  env:
    # github-mcp-server authenticates with a PAT read from
    # GITHUB_PERSONAL_ACCESS_TOKEN. .env exports GITHUB_TOKEN; map it here. If
    # GITHUB_TOKEN is unset, _substitute_spec fails LOUD at load (no silent
    # empty-PAT) and McpSessionManager.open() skips this server (per-server
    # isolation). The token needs repo + read:org scopes for the toolsets below.
    GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
  # No `tools:` allowlist yet — take everything the server exposes (verified
  # against the LIVE tools/list in Phase E; narrow to a curated set as a
  # follow-on once the tool count is known). See _apply_allowlist.
  github:
    # Release-bootstrap source: when `github-mcp-server` is NOT on PATH,
    # mcp_bootstrap.ensure_server fetches this release asset for the host's
    # {os}/{arch}, extracts the binary to .pux/mcp-servers/github/<version>/,
    # and rewrites `command` to it. Idempotent (PATH → cache → download
    # fallback). `version: latest` follows /releases/latest; pin (e.g. v1.5.0)
    # for reproducibility — the cache is keyed by version.
    repo: github/github-mcp-server
    asset: "github-mcp-server_*{os}*{arch}*.tar.gz"
    binary: github-mcp-server
    version: latest

# ── godot-mcp-runtime (Erodenn) ─────────────────────────────────────────────
# Source: https://github.com/Erodenn/godot-mcp-runtime
# TypeScript stdio server — zero-footprint (no Godot addon required). Runs via
# npx; headless editing + runtime bridge (screenshots, input sim, live GDScript).
godot-mcp-runtime:
  kind: mcp
  transport: stdio
  command: npx
  args: ["-y", "godot-mcp-runtime"]
  env:
    GODOT_PATH: ${GODOT_PATH}
  # Env: GODOT_PATH — path to the Godot 4.x executable. If Godot is on PATH,
  # this can be omitted (the server auto-detects).

# ── godot-ai (hi-godot) ─────────────────────────────────────────────────────
# Source: https://github.com/hi-godot/godot-ai
# Python (FastMCP) HTTP server + GDScript editor addon. 120+ ops across ~41 MCP
# tools. Requires the addon installed in the Godot project + uv for the server.
# 891 stars — the most popular Godot MCP server.
godot-ai:
  kind: mcp
  transport: http
  url: ${PUX_MCP_GODOT_AI_URL}
  # Env: PUX_MCP_GODOT_AI_URL — the HTTP endpoint of the godot-ai MCP server
  # (e.g. http://<host>:8000/mcp). The server is started by the Godot editor
  # plugin when the project is opened.

# ── sandbox_browser (in-container SeleniumBase MCP) ─────────────────────────
# Source: this repo — sandbox/scripts/mc_browser.py. A FastMCP server wrapping
# SeleniumBase SB(uc=True), copied into the sandbox image at /usr/local/bin/mc_browser.py
# by Dockerfile line 169. Baked into the image (fastmcp + seleniumbase installed
# at image build time, NOT ephemeral pip installs — see Dockerfile line 146).
#
# Architecture: one MCP server per agent process. The host's agent framework
# spawns `docker exec -i <sandbox> mc_browser.py` as a child subprocess; the
# MCP client connects over stdio. The MCP server owns ONE Chrome instance for
# its lifetime — when the agent process exits (stdin EOF), the server exits
# and Chrome dies with it as a child of the server's PID. No orphan helpers,
# no fuser/ss kill-stale dance, no PID cgroup trips.
#
# 42 tools including the custom CDP bridges (CDP_TYPE_JS, SIMULATE_DND_JS,
# _trusted_cdp_drag etc.) ported verbatim from sb_server.py. Plus a `run`
# escape hatch that execs arbitrary Python with the live sb in scope.
#
# Env: PUX_SANDBOX_CONTAINER — set automatically by DockerExecClient.container
# when the sandbox is resolved. The placeholder below fails loud at load time
# if the agent somehow runs without a known sandbox (e.g. a unit test context).
#
# Concurrency: each agent that references this server spawns its OWN
# mc_browser.py + its own Chrome — two agents referencing sandbox_browser get
# two browsers at the same time, with full isolation. Pattern 2 from the
# concurrency design discussion.
sandbox_browser:
  kind: mcp
  transport: stdio
  command: docker
  args: ["exec", "-i", "${PUX_SANDBOX_CONTAINER}", "mc_browser.py"]

# ── nitter (READ-ONLY Twitter via direct GraphQL) ───────────────────────────
# Source: this repo — infra/nitter/src/server.py. A FastMCP HTTP server that
# talks to Twitter's web GraphQL endpoints directly via twscrape, using auth
# cookies. Named "nitter" because the tool surface mirrors Nitter's URL paths
# (search, user_tweets, replies, following). NOT the Nitter binary — we chose
# direct GraphQL (option B in the design discussion) over self-hosting Nitter
# (option A) for resilience + speed. See infra/nitter/README.md for the
# tradeoff matrix + why twscrape is the right primary.
#
# 10 read-only tools: search, user_tweets, user_replies, user_media,
# user_profile, user_following, user_followers, tweet_details, tweet_replies,
# health. Writes (post, like, RT, follow) belong to the browser MCP at the
# twitter-agent org — this server is the read path, browser is the write path.
#
# Auth: cookies injected from env (NITTER_ACCOUNT_<KEY>_AUTH_TOKEN + _CT0 per
# account, loaded from the gitignored infra/nitter/.env via docker compose
# env_file:). twscrape round-robins across all configured accounts. SQLite
# state at /data/accounts.db (a docker volume) caches login across restarts.
#
# Env: PUX_MCP_NITTER_URL — the Streamable-HTTP MCP endpoint, e.g.
# http://localhost:41730/mcp (host-only) or https://<node>.ts.net:10000/nitter/mcp
# (via Tailscale Serve). Set in .env to point the twitter-agent org at it.
nitter:
  kind: mcp
  transport: http
  url: ${PUX_MCP_NITTER_URL}

