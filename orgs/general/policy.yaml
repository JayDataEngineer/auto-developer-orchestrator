# Declarative policy for the general org.
#
# general is the general-purpose CTO fallback — no custom sandbox image, no
# credentials, no egress allowlist of its own. This is intentionally a
# tool_servers-driven policy: the sandbox layer treats "no policy" (NoPolicy) and
# "policy with empty sections" as IDENTICAL for execution — egress_rules()
# returns "" for both (no egress.conf staged → open), and resolve_tier() returns
# the "isolated" fallback for both. So the SOLE execution effect of this file is
# opting general into the foreign MCP tool servers declared in
# orgs/_shared/tool_servers.yaml. (`protocols:` below is a non-execution axis —
# it only selects which client SURFACE pux serves the org on.) Verified 2026-07-06.
#
# web_research runs HOST-SIDE (the McpSessionManager makes the HTTP calls from
# the pux process, not from inside the org's container), so this capability is
# independent of general's sandbox egress. If the server is unreachable from a
# given deployment, McpSessionManager.open() logs a loud ERROR and contributes
# zero tools — general still starts and works (per-server isolation).
#
# github is a stdio server: McpSessionManager forks the github-mcp-server binary
# HOST-SIDE (also independent of the container egress). Its binary is fetched
# on-demand from the GitHub release when not on PATH (the mcp_bootstrap
# fallback), and its PAT is mapped from .env's GITHUB_TOKEN in the catalog
# entry. Same per-server isolation: a missing token or failed bootstrap logs
# ERROR + zero github tools; general still starts.
tool_servers:
  - web_research
  - github
# Agent-facing client SURFACES general exposes (a separate axis from sandbox
# execution — this block never affects egress/tier). [acp, agui] is the DEFAULT
# (an absent `protocols:` resolves to both), declared here explicitly so the org
# self-describes its intended surface: Toad/Zed/VS Code via `pux acp --org
# general`; CopilotKit via `pux serve` at /agui/general. An org narrowing to
# e.g. [acp] is excluded from the AG-UI mount. See policy.DEFAULT_PROTOCOLS.
protocols:
  - acp
  - agui

# Pre-run: warm the in-container SeleniumBase Chrome so the first browser tool
# call (general's `browser` agent) doesn't pay the SeleniumBase CDP-attach cold
# start — that latency is moved out of the LLM turn budget so it can't trip the
# 60s browser timeout (browser.py _BROWSER_TIMEOUT). sb_server runs in the base
# sandbox image (supervisord priority 70); this job polls /status then hits
# /warmup, which calls ensure(). Warn-and-continue: an unreachable sb_server is
# logged, not fatal (the agent then cold-starts on first use, as before).
jobs:
  - name: warmup_browser
    script: orgs/_shared/sandbox/warmup_browser.py
    timeout: 90
    description: "Pre-warm the in-container SeleniumBase Chrome (sb_server /warmup) so the first browser tool call skips cold-start latency"
