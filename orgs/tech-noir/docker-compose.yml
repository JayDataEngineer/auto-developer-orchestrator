# AUTO-GENERATED from org.toml — do not edit. Run `task org-build tech-noir`.

services:
  tech-noir-sandbox:
    image: pux-sandbox:latest
    runtime: runsc
    # Labels that let Pux adopt this container instead of spinning up a
    # sibling. Bootstrap.sh exports OPENSHELL_PROJECT_PATH so the label
    # and the bind mount stay in sync — Pux's bash executor assumes
    # /sandbox/workspace maps to the project root.
    labels:
      openshell.org-name: "tech-noir"
      openshell.project-path: "${OPENSHELL_PROJECT_PATH:-}"
      openshell.sandbox-id: "tech-noir-compose"
      openshell.policy: "developer"
    volumes:
      # Canonical Pux mount — enables container reuse. When the env var
      # is unset, mounts the compose CWD (harmless default; Pux discovery
      # fails because the label is also empty, so no wrong adoption).
      - ${OPENSHELL_PROJECT_PATH:-./}:/sandbox/workspace
      - tech-noir-workspace:/workspace
    environment:
      GODOT_MCP_URL: "http://host.docker.internal:8080"
      SURREALDB_URL: "http://host.docker.internal:8000/surreal"
      SURREALDB_NS: "studio"
      SURREALDB_DB: "tech-noir"
      SURREALDB_USER: "root"
      SURREALDB_PASS: "root"
      DOCS_SITE_PATH: "/workspace/docs-site"
      GAME_REPO_PATH: "/workspace/game"
      PUX_ORG_PATH: "/sandbox/workspace"
    deploy:
      resources:
        reservations:
          cpus: '500m'
          memory: 512Mi
        limits:
          cpus: '2'
          memory: 2Gi
    network_mode: host

volumes:
  tech-noir-workspace:
