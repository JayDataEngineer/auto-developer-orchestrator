[project]
name = "auto-developer-orchestrator"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
# The orchestrator depends on the pux-harness library (the deepagents Pux
# harness: the slim org+skill compiler + the Docker sandbox runtimes).
# pux-harness lives in its OWN repo (github.com/JayDataEngineer/pux-harness),
# pinned here as a git submodule at ./pux-harness/ — so `git clone --recursive`
# yields a known-compatible pair (the two share hard contracts: the
# ``project_root()`` path-seam, the ``pux_harness.kit`` surface, the contract
# tripwires). uv resolves it from the submodule path below.
dependencies = ["pux-harness"]

# Resolve the orchestrator's pux-harness dep to the in-tree submodule checkout
# (editable install into this repo's .venv), NOT PyPI. ``editable = true`` is
# REQUIRED: without it uv installs a NON-editable physical copy that silently
# diverges from the submodule source — the orchestrator tests would run a stale
# snapshot and harness edits would look inert until a manual reinstall. Editable
# makes the submodule source the live import target: edit + re-test, no reinstall.
[tool.uv.sources]
pux-harness = { path = "pux-harness", editable = true }

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.pytest.ini_options]
# The workspace suite: src/ IS the kit (compiler, profiles, tools, sandbox),
# imported via ``pythonpath = ["src", "."]``. The pux-harness submodule's own
# suite still runs inside the submodule until it is removed (commit 3).
testpaths = ["tests"]
pythonpath = ["src", "."]
# Async tests (src/profiles + tools exercise asyncio paths) use
# @pytest.mark.asyncio. Without ``asyncio_mode = auto`` the marker is unknown
# (PytestUnknownMarkWarning) and the coroutine is never awaited → false fail.
asyncio_mode = "auto"
markers = [
    "guards: optional repo-wide AST regression tripwires (tests/guards/) — skip with -m 'not guards'",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
# src/ is the package root (pytest mirrors this via pythonpath above) —
# without mypy_path, mypy can't resolve profiles.*/tools.*/sandbox.* imports.
# explicit_package_bases maps src/compiler/x.py → compiler.x (no src. prefix
# duplicate) — the same package-base semantics pytest gets from pythonpath.
mypy_path = ["src"]
explicit_package_bases = true

# Scoped stubs — all three resolve at the commit-3 uv sync, none are checked
# today because the current venv can't provision them:
#   yaml                    — types-PyYAML not installed in the no-sync venv
#   deepagents_code.*       — the venv's deepagents-code is the 0.0.1 stub
#                             (no app.py); the real SDK lands at commit 3
#   openshell*              — the opt-in sandbox arm; its langchain adapter
#                             pins deepagents<0.6 so it is deliberately absent
[[tool.mypy.overrides]]
module = ["yaml", "deepagents_code.*", "openshell", "langchain_nvidia_openshell"]
ignore_missing_imports = true
