[project]
name = "auto-developer-orchestrator"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[tool.uv.workspace]
members = ["harness"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
