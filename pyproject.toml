[project]
name = "auto-developer-orchestrator"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
# The orchestrator IS a dcode workspace: the org tree (profiles/) projects onto
# dcode's native surface via src/ (compiler, run.py) and runs inside dcode's
# own TUI. The dependencies are the SDK the graph + TUI are built on —
# deepagents (create_deep_agent, LocalShellBackend, RubricMiddleware) and
# deepagents-code (run_textual_app, _get_default_model_spec,
# resolve_and_load_mcp_tools) — pinned to the exact versions the operator's
# `dcode` tool install resolves (deepagents-code 0.1.55 + deepagents 0.7.5).
#
# Deliberately NOT declared: openshell / langchain-nvidia-openshell (the old
# OpenShell sandbox arm). langchain-nvidia-openshell pins deepagents<0.6 and
# can therefore never coexist with the real SDK — the submodule pyproject was
# unresolvable because of it. The opt-in PUX_SANDBOX=openshell path in
# src/sandbox/exec.py fail-louds with install instructions instead.
dependencies = [
    "deepagents==0.7.5",
    "deepagents-code[anthropic,openai]==0.1.55",
    "anthropic>=0.100",
    "langchain-anthropic>=1.5.3",
    "langchain-openai",
    "pyyaml",
    "python-dotenv>=1.0",
    "pydantic>=2",
]

[project.scripts]
pux = "compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ is a src-layout workspace (no package named after the project) — the
# wheel must carry every src package for `pux` + `uv run python -m compiler.cli`
# to work from the installed venv.
[tool.hatch.build.targets.wheel]
packages = [
    "src/compiler",
    "src/profiles",
    "src/tools",
    "src/sandbox",
    "src/middlewares",
    "src/protocol",
    "src/plugins",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-PyYAML"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Async tests (src/profiles + tools exercise asyncio paths) use
# @pytest.mark.asyncio. Without ``asyncio_mode = auto`` the marker is unknown
# (PytestUnknownMarkWarning) and the coroutine is never awaited → false fail.
asyncio_mode = "auto"
markers = [
    "guards: optional repo-wide AST regression tripwires (tests/guards/) — skip with -m 'not guards'",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
# src/ is the package root (pytest mirrors this via pythonpath above) —
# without mypy_path, mypy can't resolve profiles.*/tools.*/sandbox.* imports.
# explicit_package_bases maps src/compiler/x.py → compiler.x (no src. prefix
# duplicate) — the same package-base semantics pytest gets from pythonpath.
mypy_path = ["src"]
explicit_package_bases = true

# Scoped stubs — only the opt-in sandbox arm stays untyped: its langchain
# adapter pins deepagents<0.6 so it is deliberately absent (PUX_SANDBOX=openshell
# fail-louds). yaml + deepagents_code.* resolve from the synced venv.
[[tool.mypy.overrides]]
module = ["openshell", "langchain_nvidia_openshell"]
ignore_missing_imports = true
