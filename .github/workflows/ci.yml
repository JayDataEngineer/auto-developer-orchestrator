name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -v ./...

  go-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest
          args: --timeout=5m

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — baseline lookup needs commit SHAs

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GL_VER=8.30.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan PR diff for new secrets
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact \
            --no-banner

      - name: Scan pushed commits (with baseline) for new secrets
        if: github.event_name != 'pull_request'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --redact \
            --no-banner

  org-build:
    # Stage 3 org templating — every org.toml must render cleanly to the
    # checked-in YAML tree. Drift = renderer output != checked-in file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Renderer drift check
        run: uv run --with jinja2 python3 scripts/org_build.py --check

      - name: Renderer self-tests
        run: uv run --with jinja2,pytest,pyyaml pytest scripts/test_org_build.py -v

  frontend-test:
    # Bun workspace + root vitest config — runs all three projects (shared,
    # web, tui) in one shot. The TUI project includes the regression suite
    # that locks down store shape / event ordering / thinking render.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (workspace)
        run: bun install --frozen-lockfile

      - name: vitest run (shared + web + tui)
        run: bunx vitest run

  python-test:
    # Python E2E suite — conftest.py auto-skips any test whose required
    # service (api, sandbox, tui_visual, llm) is unreachable. So in CI this
    # ends up running just the hermetic tests (CLI harness, SSE shape, etc.)
    # while developer machines with the stack up get the full suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: pytest (auto-skip on missing services)
        working-directory: tests/python
        run: |
          uv run --with pytest,requests \
            python3 -m pytest -v --tb=short --skip-llm

  honesty-eval-smoke:
    # CI smoke for the diligence honesty eval — verifies every fixture
    # parses + has a .fails sidecar. Doesn't measure the dishonesty rate
    # (that needs a real LLM and is a tracked metric, not a gate). Run the
    # real eval locally via `task test-eval-diligence`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Honesty eval smoke (--no-llm)
        run: |
          uv run --with requests \
            python3 tests/evals/diligence/test_code_summary_honesty.py --no-llm

  playwright-smoke:
    # Mocked-backend Playwright run. The mocked project doesn't need a
    # running backend — it intercepts the SSE stream with route fakes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (workspace)
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Playwright (mocked project)
        run: |
          bunx playwright test --config=tests/playwright.config.ts --project=mocked
