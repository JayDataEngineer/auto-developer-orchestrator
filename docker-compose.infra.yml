# Host-side shared infrastructure for auto-developer-orchestrator.
#
# Everything an org needs that ISN'T the sandbox container. One command:
#
#   make infra                      # or: docker compose -f docker-compose.infra.yml up -d
#
# What lives here:
#   surrealdb   The shared knowledge graph + task_run store. Used by
#               deep-research-engine (ns: research, db: main),
#               game-studio (ns: studio, db: game-studio),
#               social-media-pipeline (task_run persistence).
#               Orgs reach it inside the sandbox via host.docker.internal:8000.
#
#   media-mcp   Audio (Parakeet ASR + Pyannote diarization), vision (Florence-2,
#               YOLO, WD14), and video analysis. Used by deep-research-engine
#               for ingest. Exposed on port 8101 — what audio_client.py defaults
#               to (MEDIA_MCP_URL=http://localhost:8101). Built from the
#               infra/media-mcp submodule. CPU by default; GPU override via
#               MEDIA_DEVICE=cuda TORCH_VARIANT=cu124 (see media-mcp Dockerfile).
#
#   nitter-mcp  READ-ONLY Twitter access (search, user_tweets, replies,
#               following lists) via direct GraphQL with auth cookies.
#               Used by twitter-agent for bulk reads at scale; the browser
#               MCP at twitter-agent handles writes (post/like/RT/follow).
#               Built from infra/nitter/ (NOT a submodule). Port 41730,
#               host-only by default — expose via Tailscale Serve.
#
#   (embeddings)  microsoft/harrier-oss-v1-0.6b loads in-process inside the
#                 sandbox via sentence-transformers (sandbox/embed.py).
#                 1024-dim, MTEB v2 69.0, 94 langs. No service, no port —
#                 it's a Python dep of the sandbox, not a container.
#
# What does NOT live here (bring your own — game-studio only):
#   Ray cluster (Tailscale) — LLM, TTS, 3D, music, ComfyUI. That's a GPU box
#   for the game studio render pipeline. No other org needs it. If you don't
#   have it, set OPENROUTER_API_KEY for LLM fallback.
#
# Data persistence:
#   Named volumes survive container rebuilds and `make infra-down`.
#   Use `make infra-destroy` to wipe the data volumes.

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: orchestrator-surrealdb
    # The official image runs as user "nonroot" by default, but the named
    # volume mounts as root:root → "Permission denied" on first write. Run
    # as root for the dev infra — this is a local dev container, not prod.
    user: "0:0"
    ports:
      - "8000:8000"
    # surrealdb 2.x deprecated file:// — use surrealkv (pure-Rust embedded
    # store, the recommended single-node backend).
    command: ["start", "--user", "root", "--pass", "root", "surrealkv:/data/srdb.db"]
    volumes:
      - surrealdb-data:/data
    restart: unless-stopped
    healthcheck:
      # The surrealdb image is distroless (apko/Chainguard) — no curl, no
      # shell. Use the surreal binary's own readiness check (same as the
      # image's built-in HEALTHCHECK).
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  media-mcp:
    build:
      context: ./infra/media-mcp
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    image: orchestrator-media-mcp:latest
    container_name: orchestrator-media-mcp
    init: true
    restart: unless-stopped
    ports:
      # 8101 is what DRE's audio_client.py defaults to
      # (MEDIA_MCP_URL=http://localhost:8101). Sandbox reaches it via
      # host.docker.internal:8101.
      - "8101:8001"
    # Allow media-mcp (inside container) to reach host ports — needed when
    # the preprocess pipeline serves audio files via a localhost HTTP server
    # and media-mcp must fetch them (ASR, voice embeddings, diarization).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MEDIA_HOST: "0.0.0.0"
      MEDIA_PORT: "8001"
      MEDIA_DEVICE: ${MEDIA_DEVICE:-cpu}
      MEDIA_PROFILE: ${MEDIA_PROFILE:-standard}
      MEDIA_IDLE_TIMEOUT: ${MEDIA_IDLE_TIMEOUT:-1800}
      # Face detection + embeddings (InsightFace buffalo_l, ~350MB). The
      # `standard` profile disables these; enable explicitly so DRE's face
      # pipeline has a working backend. CompreFace is NOT deployed —
      # media-mcp's InsightFace is the SOTA open-weight replacement that
      # face_client.py + the DRE agent can reach via MEDIA_MCP_URL.
      MEDIA_FACE_ENABLED: ${MEDIA_FACE_ENABLED:-true}
      MEDIA_EMBED_FACES_ENABLED: ${MEDIA_EMBED_FACES_ENABLED:-true}
      # Voice embeddings (WeSpeaker ResNet34, 256-d) + speaker diarization
      # (Pyannote 3.1). Both need a HuggingFace token with accepted licenses
      # for pyannote models. Enabled here so the DRE voice pipeline works.
      MEDIA_EMBED_VOICE_ENABLED: ${MEDIA_EMBED_VOICE_ENABLED:-true}
      MEDIA_PYANNOTE_ENABLED: ${MEDIA_PYANNOTE_ENABLED:-true}
      MEDIA_PYANNOTE_TOKEN: ${HF_TOKEN:-${HUGGING_FACE_HUB_TOKEN:-}}
      # cloud_vlm (MiMo-V2.5 — the MULTIMODAL variant) for video/image/audio
      # understanding. NOTE: MiMo-V2.5-Pro is text-only (reasoning); MiMo-V2.5
      # is multimodal. Pin the model explicitly so it can never regress to Pro
      # (which would silently produce hallucinated summaries from blind text
      # generation instead of real multimodal analysis). Routed via OpenRouter
      # (Parasail backend) — provider forced via MEDIA_CLOUD_VLM_PROVIDER_ONLY.
      MEDIA_CLOUD_VLM_MODEL: ${MEDIA_CLOUD_VLM_MODEL:-xiaomi/mimo-v2.5}
      MEDIA_CLOUD_VLM_API_KEY: ${OPENROUTER_API_KEY:-}
      MEDIA_CLOUD_VLM_PROVIDER_ONLY: ${MEDIA_CLOUD_VLM_PROVIDER_ONLY:-Parasail}
    volumes:
      - media-models:/app/models
    healthcheck:
      # FastMCP exposes no /health; verify the MCP endpoint answers JSON-RPC
      # (same approach as media-mcp's own docker-compose.yml).
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST http://localhost:8001/mcp
          -H 'Content-Type: application/json'
          -H 'Accept: application/json, text/event-stream'
          -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"hc","version":"1"}}}'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nitter-mcp:
    build:
      context: ./infra/nitter
    image: orchestrator-nitter-mcp:latest
    container_name: orchestrator-nitter-mcp
    init: true
    restart: unless-stopped
    # Account credentials (auth_token + ct0 per account) live in the gitignored
    # .env sibling of the nitter Dockerfile. docker compose auto-loads that file
    # because it sits in the build context — but to make the credential flow
    # EXPLICIT, we env_file: it here too. If the file is missing (first-time
    # clone), the service still starts with zero accounts and a clear log line;
    # set NITTER_ALLOW_NO_ACCOUNTS=true to silence the refusal.
    env_file:
      - ./infra/nitter/.env
    environment:
      NITTER_HOST: "0.0.0.0"
      NITTER_PORT: "41730"
      NITTER_DB_PATH: "/data/accounts.db"
      # Operator-side kill switch for first-time bring-up without credentials.
      NITTER_ALLOW_NO_ACCOUNTS: ${NITTER_ALLOW_NO_ACCOUNTS:-false}
    ports:
      # 127.0.0.1-only by default. Operators expose via Tailscale Serve
      # (`tailscale serve --set-path /nitter http://127.0.0.1:41730`) and
      # point sandbox clients at PUX_MCP_NITTER_URL. Don't put authenticated
      # Twitter read access on a public interface by default.
      - "127.0.0.1:41730:41730"
    volumes:
      - nitter-db:/data
    healthcheck:
      # FastMCP exposes /health as a custom_route in nitter-mcp's server.py —
      # plain GET, no MCP round-trip. Cheaper than the JSON-RPC probe above.
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:41730/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# No TEI service. Embeddings (microsoft/harrier-oss-v1-0.6b) load in-process
# via sentence-transformers inside the sandbox (sandbox/embed.py). The model
# card's canonical path is `SentenceTransformer("microsoft/harrier-oss-v1-0.6b")`,
# not an HTTP server. First use downloads weights to $HF_HOME=/data/hf-cache.

volumes:
  surrealdb-data:
  media-models:
  nitter-db:
