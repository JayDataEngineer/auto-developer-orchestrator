[project]
name = "browser_specialist"
version = "0.1.0"
description = "browser-specialist"
requires-python = ">=3.12"

dependencies = [
    "aegra-cli>=0.10.2",
    "deepagents>=0.7",
    "langchain-mcp-adapters>=0.1",
    "langgraph>=1.0.8",
    "langchain>=0.3.14",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.12",
    "opensandbox>=0.1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_specialist"]
