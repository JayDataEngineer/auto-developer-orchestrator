app: minecraft
type: game
detect:
  window_title: "Minecraft"

actions:
  move_forward:
    key: w
    hold: true

  move_backward:
    key: s
    hold: true

  move_left:
    key: a
    hold: true

  move_right:
    key: d
    hold: true

  jump:
    key: space

  sneak:
    key: Shift_L
    hold: true

  open_inventory:
    key: e
    wait: 500

  close_inventory:
    key: Escape

  break_block:
    mouse: left
    mouse_hold: true

  place_block:
    mouse: right

  select_slot:
    key: "{slot}"
    params:
      slot:
        type: int
        range: [1, 9]

  drop_item:
    key: q

  send_command:
    steps:
      - key: T
      - type: "{text}"
      - key: Return
    params:
      text:
        type: string

  toggle_perspective:
    key: F5

  open_chat:
    key: T

  screenshot:
    key: F2
