description: "Deep web research — search, scrape, crawl, map"
implementations:
  - name: cloud
    type: mcp
    priority: 1
    mcp_servers: [web]
    prompt_file: prompts/cloud.md
    health: {kind: mcp-available, server: web}

  - name: bash-ddg
    type: bash
    priority: 99
    tools: [bash]
    script: /sandbox/ddg.py
    prompt_file: prompts/bash-ddg.md
    health: {kind: always-true}
    decl_tools:
      - name: ddg_search
        description: "Search DuckDuckGo HTML (degraded tier). Returns JSON [{title,url,snippet}]. Snippet-level only — no page fetching."
        command: "python3 /sandbox/ddg.py {{query}} --max {{max}}"
        timeout: 30
        parameters:
          - {name: query, type: string, description: "Search query", required: true}
          - {name: max, type: integer, description: "Max results (default 8)", default: 8}
