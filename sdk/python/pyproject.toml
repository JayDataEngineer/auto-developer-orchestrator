[project]
name = "orch-sdk"
version = "0.1.0"
description = "Python SDK for the Auto-Developer Orchestrator"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orch"]
