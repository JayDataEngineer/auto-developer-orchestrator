[project]
name = "tool-scoping-dcode"
version = "0.1.0"
description = "Model-keyed harness profiles for dcode: scopes MCP tools away from no-MCP subagents (bridge until upstream per-subagent tools: frontmatter lands)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.entry-points."deepagents.harness_profiles"]
tool_scoping = "tool_scoping_dcode:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tool_scoping_dcode"]
