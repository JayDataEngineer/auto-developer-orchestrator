[project]
name = "opensandbox-dcode"
version = "0.1.0"
description = "OpenSandbox sandbox provider for Deep Agents Code (dcode --sandbox opensandbox)"
requires-python = ">=3.11"
dependencies = ["opensandbox>=0.1.4,<0.2.0"]

[project.entry-points."deepagents_code.sandbox_providers"]
opensandbox = "opensandbox_dcode.provider:OpenSandboxProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opensandbox_dcode"]
