# Development Docker Compose - Hot Reload Enabled
# Integrated with shared-docker-infra via Traefik
services:
  # ===========================================
  # Go Backend with Hot Reload (Air) + Pi Agent
  # ===========================================
  go-backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile.dev
    container_name: orchestrator-go-dev
    environment:
      - SERVER_PORT=3847
      - DATABASE_URL=/data/orchestrator.db
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - PROJECT_ROOT=/app/projects
      - PI_AGENT_DIR=/root/.pi
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://host.docker.internal:3100}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-orch-2026-lf-a1b2c3d4e5f6}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-orch-2026-lf-a1b2c3d4e5f6}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - OPENSHELL_POLICIES_DIR=/etc/openshell/policies
      - OPENSHELL_IMAGE=pux-sandbox:latest
      - OPENSHELL_NETWORK=shared-infra
    volumes:
      - ./go-backend:/app
      - ./projects:/app/projects
      - ./data:/data
      - pi-config:/root/.pi
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./openshell/policies:/etc/openshell/policies:ro
    networks:
      - shared-infra
    ports:
      - "3847:3847"
    command: ["air", "-c", ".air.toml"]
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator-go-dev.rule=Host(`orchestrator-go.${INFRA_DOMAIN:-local}`)"
      - "traefik.http.routers.orchestrator-go-dev.entrypoints=http"
      - "traefik.http.services.orchestrator-go-dev.loadbalancer.server.port=3847"
      - "traefik.http.routers.orchestrator-go-dev.priority=10"

  # ===========================================
  # React Frontend (Vite Dev Server)
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: orchestrator-frontend-dev
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_PORT=5194
      - VITE_API_URL=http://orchestrator.local/api
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - shared-infra
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5194"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator-frontend.rule=Host(`orchestrator.${INFRA_DOMAIN:-local}`)"
      - "traefik.http.routers.orchestrator-frontend.entrypoints=http"
      - "traefik.http.services.orchestrator-frontend.loadbalancer.server.port=5194"
      - "traefik.http.routers.orchestrator-frontend.priority=5"

  # ===========================================
  # OpenShell Sandbox Base (Dev)
  # ===========================================
  # Note: Individual sandbox containers are created dynamically by the Go backend.
  # Start with: docker compose -f docker-compose.dev.yml --profile sandbox up -d
  openshell-manager:
    image: pux-sandbox:latest
    container_name: orchestrator-openshell
    profiles: ["sandbox"]
    privileged: false
    environment:
      - SANDBOX_POLICY=developer
      - NETWORK_ALLOW=github.com,api.anthropic.com,api.openai.com,api.openrouter.com
      - FS_READONLY=/etc,/usr,/bin,/lib,/lib64
      - FS_READWRITE=/sandbox/workspace,/sandbox/tmp
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./projects:/sandbox/workspace
      - ./openshell/policies:/etc/openshell/policies:ro
      - ./openshell/data:/sandbox/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp:/sandbox/tmp
    networks:
      - shared-infra
    labels:
      - "openshell.policy=developer"

volumes:
  pi-config:

networks:
  shared-infra:
    external: true
    name: ${SHARED_NETWORK_NAME:-shared-infra}
