extends: general
agents: [telegram-drafter]

# MCP is security-scoped + NEVER inherited via ``extends:`` (each org owns its
# egress). web_research is redeclared here to arm the ``web-search`` agent
# inherited from general. Host-side server (HTTP) — no policy.yaml egress needed.
capabilities:
  - {kind: mcp, ref: web_research}
  # arms the ``browser`` agent inherited from general's roster (browser family migrated off the specialist
  # registry onto this in-container MCP server); security-scoped, so redeclared rather than inherited.
  - {kind: mcp, ref: sandbox_browser}
