# Optional per-org harness profile. Applied to the deepagents
# stack the harness compiles for this org — org-wide: the CTO system prompt AND
# every specialist subagent (so the shared browser agent inherits it too). See
# pux-harness/pux_harness/agent/profile.py for the schema + the why-not-registry
# rationale, and AGENTS.md for the field reference.

# Pin base_model to the worker tier — twitter-agent drives x.com via browser
# tools (navigate, click, screenshot) and must be able to SEE the screenshots
# its own actions produce (the act→observe→decide loop). A text-only base
# would be blind to the page state. @worker (mimo-v2.5) is multimodal, so
# driver_multimodal(base) returns True → the agent declares
# promptCapabilities.image=true → the editor/Hermes can attach images, and
# BrowserVisionMiddleware (if armed) can caption screenshots inline.
models:
  base_model: "@worker"

# Appended to the assembled CTO prompt + each subagent's system prompt.
system_prompt_suffix: |
  When drafting tweets, always save as a draft — never publish directly. Prefer
  the logged-in x.com session (browser_save_session after login) over
  re-authenticating each run.

# Rewrite a tool's description (keyed by its full tool name — here the
# sandbox_browser MCP tool, after the browser family migrated off the
# specialist registry). Use this to nudge how the model calls a tool in THIS
# org's context.
tool_description_overrides:
  mcp__sandbox_browser__browser_save_session: "Persist the logged-in x.com session to the given /tmp path so the next run can browser_restore_session it without re-login."

# Tools to drop from this org's stack entirely (full names). Empty here —
# listed for completeness.
excluded_tools: []

# Enable ask_user HITL — agent can ask Hermes questions mid-task.
ask_user: true
