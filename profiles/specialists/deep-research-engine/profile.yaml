ask_user: true

# ``interpreter`` (CodeInterpreterMiddleware) — the dynamic-subagent happy path.
# Was auto-armed by the deleted strength gate; now an explicit opt-in. DRE's
# CTO dispatches gather/synthesize/audit subagents — keep the eval tool.
middleware:
  supervisor:
    add:
      - interpreter

# Research-quality rubric gate. Each DRE agent (auditor, synthesizer, writer)
# declares its OWN rubric via frontmatter `rubric:` + `middleware: [rubric]`,
# which OVERRIDES this default via the _RubricOverride middleware. The gate
# itself (enabled + max_iterations) is armed here so the per-agent
# RubricMiddleware actually fires — without `enabled: true` the frontmatter
# rubric is inert. The agent fails its gate by default; the grader marks
# `satisfied` only when EVERY clause is proven from the agent's own tool
# output + the artifact it wrote.
#
# The default below is the SUPERVISOR's rubric (the CTO overlay) — it grades
# the CTO's own dispatch/iteration loop, not the subagents' work. Each
# subagent's specialized rubric lives on its own agent spec.
rubric:
  enabled: true
  max_iterations: 3
  default: |
    Grade whether the CTO's pipeline dispatch was actually completed with
    evidence, not just narrated. Read the artifacts the subagents wrote —
    do NOT trust a "done" summary. The CTO fails this gate by default; only
    mark `satisfied` when EVERY clause is proven.
    - Every delegate-to-subagent call returned an artifact path that EXISTS
      and was read back (cite the read command + a salient line from each).
    - The pipeline stage that was requested (gather / synthesize / audit /
      publish) actually produced its canonical artifact (brief.md,
      audit_report.md, article.md / posts/).
    - When the auditor was delegated to, its `overall:` verdict was read +
      acted on — re-dispatched on `fail`, yielded on `pass`. Ignoring an
      auditor fail is an automatic gate fail.
    - COVERAGE GATES (checks 9–14): if the auditor reports ANY coverage
      ratio below 95% (photos unanalyzed, text messages uningested, video
      keyframes blind, ghost URLs in artifacts, entity folder is a modality
      dump), the CTO MUST re-dispatch the relevant gather sub-pipeline to
      close the gap BEFORE yielding. Yielding with open coverage gaps is an
      AUTOMATIC GATE FAIL — no exceptions. A pipeline that analyzes 219 of
      1,454 photos has not "succeeded partially"; it has FAILED. Cite the
      re-dispatch call + the post-rerun audit showing the gap closed.
    - SurrealDB was queried for prior work before re-gathering (principle #1
      — query before you delegate). Cite the query + its row count.
    - No `TODO`, `[insert here]`, or "some say / experts believe" hedges in
      any yielded artifact.
    - The final yield names the deliverable path(s) + a one-line summary —
      not a play-by-play.
