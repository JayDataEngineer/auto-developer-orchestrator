extends: general
agents: [dre-auditor, dre-synthesizer, dre-writer]

# MCP is security-scoped + NEVER inherited via ``extends:``. web_research is
# redeclared here to arm the ``web-search`` agent inherited from general.
# surreal is SurrealDB's built-in MCP server (3.1+) — exposes query, insert,
# upsert, relate, select, run, etc. as mcp__surreal__<tool>. The agent uses
# these for ALL knowledge-graph operations. No CLI scripts, no subprocess-per-
# call — the harness holds a persistent MCP connection.
capabilities:
  - {kind: mcp, ref: web_research}
  # arms the ``browser`` agent inherited from general's roster (the browser
  # family migrated off the specialist registry onto this in-container MCP
  # server) — security-scoped, so never inherited via ``extends:``.
  - {kind: mcp, ref: sandbox_browser}
  - {kind: mcp, ref: surreal}
