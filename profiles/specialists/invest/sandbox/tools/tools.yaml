# Declared sandbox tools for the invest org.
#
# DORMANT (2026-08-16 fold): these are the opt-in sandbox arm's script
# catalog — the declared.py auto-translation layer (typed StructuredTools
# that docker exec'd the scripts IN-CONTAINER) died with the harness, so no
# tool is built from this file today. Kept as the arm's spec for when the
# PUX_SANDBOX=openshell adapter returns.
#
# Type vocab: string / integer / number / boolean.
# invoke: flags (default, robust) -> --name value (boolean -> --name store_true).
# invoke: positional -> values in declared order.
# subcommand: optional leading positional word before args.
# returns: text (default) | json (parse stdout as JSON).
tools:
  # --- signals.py -----------------------------------------------------------
  - name: scan_signals
    description: >-
      Score a ticker (or the default watchlist) through the invest org's
      multi-signal fusion engine, which combines fundamentals, technicals, and
      sentiment into one fused score. Call this directly instead of shelling out
      to signals.py. Omit `ticker` to score the configured watchlist.
    script: signals.py
    subcommand: score
    invoke: flags
    returns: json
    args:
      - name: ticker
        type: string
        required: false
        description: "Ticker symbol to score, e.g. AAPL. Omit to score the default watchlist."

  - name: rank_signals
    description: >-
      Rank all tickers in the watchlist by their fused composite score. Returns
      a ranked list from highest to lowest score. Equivalent to
      `signals.py rank`.
    script: signals.py
    subcommand: rank
    invoke: flags
    returns: json

  # --- regime.py ------------------------------------------------------------
  - name: detect_regime
    description: >-
      Classify the current market regime (bull/bear/sideways) using trend,
      volatility, momentum, and breadth scoring. Returns regime label,
      composite score, confidence, and recommended strategy adjustments.
    script: regime.py
    subcommand: detect
    invoke: flags
    returns: json

  - name: regime_adjusted_signal
    description: >-
      Get a regime-adjusted trading view for a specific ticker. Factors in
      the current market regime's position size multiplier, confidence
      adjustment, and bias direction.
    script: regime.py
    subcommand: signal
    invoke: flags
    returns: json
    args:
      - name: ticker
        type: string
        required: true
        description: "Ticker symbol, e.g. AAPL"

  - name: regime_history
    description: >-
      Show past market regime detections. Returns recent regime labels,
      scores, and confidence levels over time.
    script: regime.py
    subcommand: history
    invoke: flags
    returns: json
    args:
      - name: limit
        type: integer
        required: false
        default: 10
        description: "Number of recent regime records to show (default 10)"

  # --- risk.py --------------------------------------------------------------
  - name: assess_risk
    description: >-
      Full portfolio risk assessment: position concentration, sector exposure,
      portfolio heat, max drawdown, and per-asset ATR levels. Returns a
      comprehensive risk report with stop prices and warnings.
    script: risk.py
    subcommand: assess
    invoke: flags
    returns: json

  - name: check_trade_risk
    description: >-
      Pre-trade risk check for a specific asset. Validates position sizing,
      portfolio heat limits, sector concentration, and stop-loss placement
      before execution.
    script: risk.py
    subcommand: check
    invoke: flags
    returns: json
    args:
      - name: ticker
        type: string
        required: true
        description: "Ticker symbol, e.g. AAPL"
      - name: shares
        type: integer
        required: true
        description: "Number of shares to check"
      - name: price
        type: number
        required: true
        description: "Current or estimated entry price"

  - name: size_position
    description: >-
      Calculate volatility-adjusted position size for a ticker using ATR
      and Kelly-inspired sizing. Accounts for current confidence and price.
    script: risk.py
    subcommand: size
    invoke: flags
    returns: json
    args:
      - name: ticker
        type: string
        required: true
        description: "Ticker symbol, e.g. AAPL"
      - name: confidence
        type: number
        required: true
        description: "Signal confidence (0.0 to 1.0)"
      - name: price
        type: number
        required: true
        description: "Current price for position sizing"

  - name: calc_stops
    description: >-
      Calculate ATR-based stop-loss and take-profit prices for positions.
      Specify symbols or omit for all active positions.
    script: risk.py
    subcommand: stops
    invoke: flags
    returns: json
    args:
      - name: symbols
        type: string
        required: false
        description: "Space-separated symbol list, e.g. 'AAPL MSFT'. Omit for all positions."

  - name: generate_orders
    description: >-
      Generate stop-loss and take-profit orders for all current positions
      based on ATR multipliers from the risk config.
    script: risk.py
    subcommand: orders
    invoke: flags
    returns: json

  # --- fetch_data.py --------------------------------------------------------
  - name: fetch_market_data
    description: >-
      Fetch comprehensive market data: stock prices, crypto prices, technical
      indicators (RSI, EMA, MACD, Bollinger), fundamentals (PE, growth,
      margins), and macro indicators. Writes to market_data.json and returns
      JSON. Filter by asset class with --stocks-only or --crypto-only.
    script: fetch_data.py
    invoke: flags
    returns: json
    timeout: 180
    args:
      - name: stocks_only
        type: boolean
        required: false
        default: false
        description: "Fetch only stock assets (skip crypto and macro)"
      - name: crypto_only
        type: boolean
        required: false
        default: false
        description: "Fetch only crypto assets (skip stocks and macro)"
      - name: skip_macro
        type: boolean
        required: false
        default: false
        description: "Skip macro tickers (FRED + commodities)"
      - name: history_days
        type: integer
        required: false
        default: 90
        description: "Days of price history to fetch (default 90)"

  # --- journal.py -----------------------------------------------------------
  - name: record_prediction
    description: >-
      Record a single prediction in the prediction journal with ticker,
      action, confidence, price, and reasoning.
    script: journal.py
    subcommand: record
    invoke: flags
    returns: json
    args:
      - name: ticker
        type: string
        required: true
        description: "Ticker symbol, e.g. AAPL"
      - name: action
        type: string
        required: true
        description: "Prediction action: buy, strong_buy, sell, strong_sell, hold"
      - name: confidence
        type: number
        required: true
        description: "Confidence score (0.0 to 1.0)"
      - name: price
        type: number
        required: true
        description: "Price at time of prediction"
      - name: reasoning
        type: string
        required: false
        default: ""
        description: "Optional reasoning text for the prediction"

  - name: journal_stats
    description: >-
      Show prediction accuracy statistics: total predictions, accuracy
      percentage, win rate by action type, average return, and per-ticker
      breakdown. Optionally filter by ticker.
    script: journal.py
    subcommand: stats
    invoke: flags
    returns: json
    args:
      - name: ticker
        type: string
        required: false
        default: ""
        description: "Filter stats by ticker symbol (optional)"

  - name: journal_recent
    description: >-
      Show recent predictions from the journal with timestamps, actions,
      confidence levels, and outcomes.
    script: journal.py
    subcommand: recent
    invoke: flags
    returns: json
    args:
      - name: limit
        type: integer
        required: false
        default: 10
        description: "Number of recent predictions to show (default 10)"

  - name: journal_breakdown
    description: >-
      Show accuracy breakdown by action type (buy/sell/hold), confidence
      bands, and ticker. Useful for identifying which signal types perform
      best.
    script: journal.py
    subcommand: breakdown
    invoke: flags
    returns: json

  - name: evaluate_predictions
    description: >-
      Evaluate all pending predictions against actual price movements at
      1-day, 7-day, and 30-day horizons. Updates journal with outcomes.
    script: journal.py
    subcommand: evaluate
    invoke: flags
    returns: json

  # --- crypto.py ------------------------------------------------------------
  - name: crypto_snapshot
    description: >-
      Fetch cryptocurrency market data: funding rates, open interest, order
      book depth, and a composite crypto score. Defaults to BTCUSDT. Use
      --onchain for on-chain metrics (BTC or ETH).
    script: crypto.py
    invoke: flags
    returns: json
    args:
      - name: symbol
        type: string
        required: false
        default: "BTCUSDT"
        description: "Binance futures symbol, e.g. BTCUSDT, ETHUSDT"
      - name: funding_only
        type: boolean
        required: false
        default: false
        description: "Fetch only funding rate data"
      - name: onchain
        type: string
        required: false
        default: ""
        description: "Fetch on-chain metrics: 'BTC' or 'ETH'"

  # --- macro.py -------------------------------------------------------------
  - name: macro_snapshot
    description: >-
      Fetch macro-economic data from FRED (Fed Funds, 10Y yield, CPI, GDP,
      unemployment) and yield curve analysis. Requires FRED_API_KEY env var.
    script: macro.py
    invoke: flags
    returns: json
    args:
      - name: series
        type: string
        required: false
        description: "Comma-separated FRED series IDs, e.g. 'FEDFUNDS,DGS10'. Omit for defaults."
      - name: yield_curve
        type: boolean
        required: false
        default: false
        description: "Yield curve analysis only (10Y-2Y spread)"

  # --- walkforward.py -------------------------------------------------------
  - name: walkforward_backtest
    description: >-
      Run walk-forward backtest on a ticker to validate the signal scoring
      system's predictive power. Returns correlation, Sharpe ratio, and win
      rates by action type.
    script: walkforward.py
    subcommand: backtest
    invoke: flags
    returns: json
    timeout: 300
    args:
      - name: ticker
        type: string
        required: false
        default: ""
        description: "Ticker to backtest (default: watchlist)"
      - name: period
        type: string
        required: false
        default: "1y"
        description: "Lookback period, e.g. '1y', '6mo'"

  - name: walkforward_optimize
    description: >-
      Grid-search over signal pillar weights to find the optimal
      combination for the current market. Returns recommended weight
      changes.
    script: walkforward.py
    subcommand: optimize
    invoke: flags
    returns: json
    timeout: 600
    args:
      - name: period
        type: string
        required: false
        default: "1y"
        description: "Lookback period for optimization"

  - name: walkforward_report
    description: >-
      Show the latest walk-forward validation report with correlations,
      Sharpe ratios, drawdowns, and recommended weight adjustments.
    script: walkforward.py
    subcommand: report
    invoke: flags
    returns: json

  # --- historical.py --------------------------------------------------------
  - name: historical_simulation
    description: >-
      Run a historical multi-day simulation replaying the full scoring,
      regime detection, position sizing, and trading pipeline across N
      months. Returns P&L, Sharpe, drawdown, and trade log.
    script: historical.py
    subcommand: run
    invoke: flags
    returns: json
    timeout: 600
    args:
      - name: months
        type: integer
        required: false
        default: 3
        description: "Number of months to simulate (default 3)"
      - name: tickers
        type: string
        required: false
        default: ""
        description: "Comma-separated tickers, e.g. 'AAPL,MSFT,NVDA'"
      - name: ai
        type: boolean
        required: false
        default: false
        description: "Use LLM for signal generation instead of rule-based"

  - name: historical_report
    description: >-
      Show the latest historical simulation results: total return, benchmark
      comparison, Sharpe ratio, max drawdown, win rate, and profit factor.
    script: historical.py
    subcommand: report
    invoke: flags
    returns: json

  # --- alpha.py -------------------------------------------------------------
  - name: alpha_factors
    description: >-
      Compute expanded alpha factors (20+ technical indicators) for a
      ticker. Goes beyond basic RSI/EMA/Bollinger with advanced indicators
      like Chandelier Exit, KST, and Vortex.
    script: alpha.py
    subcommand: factors
    invoke: flags
    returns: json
    args:
      - name: ticker
        type: string
        required: false
        default: ""
        description: "Ticker symbol, e.g. AAPL (default: watchlist)"

  - name: alpha_hrp
    description: >-
      Run Hierarchical Risk Parity portfolio allocation. Returns optimized
      portfolio weights based on the covariance structure of the asset
      universe.
    script: alpha.py
    subcommand: hrp
    invoke: flags
    returns: json
    args:
      - name: capital
        type: number
        required: false
        default: 100000
        description: "Starting capital for allocation (default 100000)"

  # --- backtest.py ----------------------------------------------------------
  - name: backtest_date
    description: >-
      Single-date backtest: builds a market snapshot as the agent would
      have seen it on a specific historical date. Includes technical
      indicators computed only from data available on that date.
    script: backtest.py
    invoke: flags
    returns: json
    timeout: 120
    args:
      - name: date
        type: string
        required: true
        description: "Historical date YYYY-MM-DD"
      - name: stocks
        type: string
        required: false
        default: ""
        description: "Space-separated stock symbols to backtest (default: watchlist)"

  - name: backtest_score_report
    description: >-
      Generate a score report from all saved backtest predictions: accuracy,
      returns by symbol, best/worst predictions. Evaluates pending predictions
      first.
    script: backtest.py
    invoke: flags
    returns: json
    args:
      - name: report
        type: boolean
        required: false
        default: false
        description: "Set to true to generate the score report"

  # --- trade.py -------------------------------------------------------------
  - name: portfolio_status
    description: >-
      Show current Alpaca paper portfolio status: account equity, cash,
      buying power, open positions with P&L, and market open state.
      Requires ALPACA_API_KEY and ALPACA_SECRET_KEY.
    script: trade.py
    invoke: flags
    returns: json
    args:
      - name: status
        type: boolean
        required: false
        default: false
        description: "Set to true to show portfolio status only"

  - name: portfolio_ledger
    description: >-
      Show the portfolio ledger with P&L history over time: equity
      snapshots, daily change, total return, position breakdown, and
      cumulative performance.
    script: trade.py
    invoke: flags
    returns: json
    args:
      - name: ledger
        type: boolean
        required: false
        default: false
        description: "Set to true to show portfolio ledger"

  - name: execute_trades
    description: >-
      Execute trading signals from signals.json via Alpaca paper trading
      API. Submits market orders for buy/sell signals with position sizing.
      Returns trade execution results and portfolio snapshot.
    script: trade.py
    invoke: flags
    returns: json
    timeout: 60
    args:
      - name: signals
        type: string
        required: false
        default: ""
        description: "Path to signals JSON file (default: data/signals.json)"

  # --- record_metrics.py ----------------------------------------------------
  - name: record_invest_metrics
    description: >-
      Aggregate invest-bot metrics into a JSON blob: Sharpe ratio, max
      drawdown, return %, win rate, profit factor. In live mode collects
      from Alpaca + regime + journal. In simulation mode reads from the
      historical walk output.
    script: record_metrics.py
    invoke: flags
    returns: json
    args:
      - name: mode
        type: string
        required: false
        default: "live"
        description: "'live' (default) or 'simulation' for historical walk output"

  # --- walk_progress.py -----------------------------------------------------
  - name: show_walk_progress
    description: >-
      Show the current walk-through progress: total dates, completed,
      current, failed, and estimated remaining time. Useful during long
      historical walks.
    script: walk_progress.py
    subcommand: show
    invoke: flags
    returns: json

  # --- historical_research.py -----------------------------------------------
  - name: research_plan
    description: >-
      Generate a research plan for a historical date: tickers, CIK numbers,
      SEC filing URLs, news queries, FRED observations, and macro context.
      Used during backtest walks to gather qualitative context.
    script: historical_research.py
    invoke: flags
    returns: json
    args:
      - name: date
        type: string
        required: true
        description: "Historical date YYYY-MM-DD"
      - name: ticker
        type: string
        required: false
        default: ""
        description: "Specific ticker to research (optional)"
