# Declarative sandbox policy for org video-production.
# Builds the specialized image (manim + kokoro + ffmpeg) on first sandbox start
# via sandbox.build, then reuses it. No external egress — TTS runs locally via
# Kokoro.

sandbox:
  image: video-production-video-producer:latest
  build:
    dockerfile: profiles/specialists/video-production/Dockerfile
    context: profiles/specialists/video-production

credentials:
  optional:
    - KOKORO_VOICE
    - KOKORO_LANG_CODE

jobs:
