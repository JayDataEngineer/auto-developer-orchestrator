# Shared catalog of upstream skill libraries (external repos).
# Schema: {name: {repo, description, install, tags?, tools? (install method)}}
#
# An org opts in by referencing skills from this catalog in its SKILL.md or
# AGENTS.md. Unlike tool_servers (which are live MCP connections), skills are
# static knowledge repos — cloned or installed into the sandbox workspace.
#
# Install methods:
#   npx    — `npx skills add <repo>/<path>` (Claude Code / opencode skill plugin)
#   pip    — `pip install <package>` (Python CLI tools)
#   plugin — `claude plugin marketplace add <repo>` (Claude Code plugin)
#   git    — `git clone <url>` (manual, no package manager)

# ── GD-Agentic-Skills (thedivergentai) ──────────────────────────────────────
# Source: https://github.com/thedivergentai/GD-Agentic-Skills
# 96 expert skills + 27 genre blueprints for Godot 4.5+. Agent-first knowledge
# library — strictly typed GDScript patterns, decoupled signals, scene architecture.
# LGPL-3.0. Install the godot-master orchestrator or individual domain skills.
gd-agentic-skills:
  repo: thedivergentai/GD-Agentic-Skills
  description: >
    96 expert skills + 27 genre blueprints for Godot 4.5+. Covers architecture,
    2D/3D systems, gameplay mechanics, UI, networking, and 26 genre-specific
    blueprints (RPG, platformer, roguelike, horror, etc.). Agent-first design —
    load into workspace so code uses strictly typed GDScript and proper patterns
    without prompting.
  install:
    method: npx
    # Godot Master orchestrator (recommended entry point):
    command: "npx skills add thedivergentai/gd-agentic-skills/skills/godot-master"
    # Individual domain skill example:
    # command: "npx skills add thedivergentai/gd-agentic-skills/skills/godot-characterbody-2d"
  tags: [godot, gdscript, game-dev, architecture, genre-blueprints]

# ── godot-animation-verifier (splitatomlabs) ────────────────────────────────
# Source: https://github.com/splitatomlabs/godot-animation-verifier
# Claude Code plugin + Python CLI. Boots Godot headlessly via --write-movie,
# runs frame-by-frame OpenCV analysis to find abrupt visual snapping (missing
# transitions/tweens), returns structured JSON bug report for AI self-correction.
# MIT. Python 3.x + Godot 4.x required.
godot-animation-verifier:
  repo: splitatomlabs/godot-animation-verifier
  description: >
    Detects missing animations in Godot scenes. Captures rendered frames via
    Godot --write-movie, analyzes for motion discontinuities with OpenCV, and
    returns structured JSON (pass/fail + issues with timestamps and hints).
    Works alongside MCP servers — they edit scenes, this verifies the visual result.
  install:
    method: pip
    command: "pip install godot-animation-verifier"
    # Claude Code plugin alternative:
    # method: plugin
    # command: "claude plugin marketplace add splitatomlabs/godot-animation-verifier"
  tags: [godot, animation, testing, opencv, ci-cd, verification]

# ── Gemma-4-Tools (a3xrfgb) ─────────────────────────────────────────────────
# Source: https://github.com/a3xrfgb/Gemma-4-Tools
# Python tools powered by Gemma 4 for media captioning and transcription.
# Image captioners (extreme detail, JSON style, LoRA trainer), video captioner
# (Ltx 2.3), image renamer, Whisper audio transcriber, auto-captioner variants.
# Apache-2.0. Requires Gemma 4 GGUF model (lmstudio-community/gemma-4-E4B-it-GGUF).
gemma-4-tools:
  repo: a3xrfgb/Gemma-4-Tools
  description: >
    Gemma 4-powered media tools: extreme-detail image captioning, JSON-style
    captioning, LoRA style trainer captioning, video captioning for Ltx 2.3,
    image renaming, Whisper audio transcription, and auto-captioner variants.
    Standalone Python scripts — clone and run directly.
  install:
    method: git
    command: "git clone https://github.com/a3xrfgb/Gemma-4-Tools.git"
  tags: [gemma, captioning, image, video, audio, transcription, media]
