# Standalone Langfuse v3 — LLM Observability for the Orchestrator
#
# Runs on port 3100 with its own Postgres, ClickHouse, Redis, MinIO.
# No dependencies on shared-infra or Traefik.
#
# Usage:
#   docker compose -f docker-compose.langfuse.yml up -d
#   Open http://localhost:3100
#
# Stop:
#   docker compose -f docker-compose.langfuse.yml down

name: orchestrator-langfuse

services:
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: orchestrator-langfuse
    restart: unless-stopped
    ports:
      - "3100:3000"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      # NextAuth
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: orch-langfuse-nextauth-2026
      SALT: orch-langfuse-salt-2026
      ENCRYPTION_KEY: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2

      # Node
      NODE_OPTIONS: --max-old-space-size=2048

      # Postgres
      DATABASE_URL: postgresql://langfuse:orchpg2026@langfuse-postgres:5432/langfuse

      # ClickHouse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: orchch2026
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # Redis
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: orchredis2026

      # S3 / MinIO — events
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: orchminio2026
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

      # S3 / MinIO — media
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: orchminio2026
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

      # Caching
      LANGFUSE_CACHE_API_KEY_ENABLED: "true"
      LANGFUSE_CACHE_API_KEY_TTL_SECONDS: "300"
      LANGFUSE_CACHE_PROMPT_ENABLED: "true"
      LANGFUSE_CACHE_PROMPT_TTL_SECONDS: "300"

      # Auto-init on first boot
      LANGFUSE_INIT_ORG_ID: orchestrator
      LANGFUSE_INIT_ORG_NAME: Orchestrator
      LANGFUSE_INIT_PROJECT_ID: default
      LANGFUSE_INIT_PROJECT_NAME: Orchestrator Traces
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-orch-2026-lf-a1b2c3d4e5f6
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-orch-2026-lf-a1b2c3d4e5f6
      LANGFUSE_INIT_USER_EMAIL: admin@orchestrator.local
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: orch-admin-2026

      # Telemetry off
      TELEMETRY_ENABLED: "false"
      NEXT_PUBLIC_TELEMETRY_ENABLED: "false"

      HOSTNAME: "0.0.0.0"
      PORT: "3000"

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: orchestrator-langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:orchpg2026@langfuse-postgres:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: orchch2026
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: orchredis2026
      NEXTAUTH_SECRET: orch-langfuse-nextauth-2026
      SALT: orch-langfuse-salt-2026
      ENCRYPTION_KEY: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: orchminio2026
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

  langfuse-postgres:
    image: postgres:17-alpine
    container_name: orchestrator-langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: orchpg2026
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: orchestrator-langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: orchch2026
      TZ: UTC
    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: redis:7-alpine
    container_name: orchestrator-langfuse-redis
    restart: unless-stopped
    command: redis-server --requirepass orchredis2026 --maxmemory-policy noeviction
    volumes:
      - langfuse_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "orchredis2026", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-minio:
    image: minio/minio
    container_name: orchestrator-langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: orchminio2026
    volumes:
      - langfuse_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  langfuse_postgres:
  langfuse_clickhouse:
  langfuse_clickhouse_logs:
  langfuse_redis:
  langfuse_minio:
