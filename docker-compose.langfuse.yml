# Self-hosted Langfuse v3 — observability for Pux thread monitoring.
#
# Mirrors the official Langfuse docker-compose.yml structure:
#   - langfuse-db:        Postgres (metadata: users, projects, API keys)
#   - langfuse-redis:     background job queue
#   - langfuse-clickhouse: trace/observation data (analytic column store)
#   - langfuse-minio:     S3-compatible object storage (event/media uploads)
#   - langfuse-worker:    async event ingestion worker
#   - langfuse:           web UI + API (the SDK posts traces here)
#
# CRITICAL fixes vs the first attempt:
#   1. CLICKHOUSE_CLUSTER_ENABLED=false  (NOT the old CLICKHOUSE_CLUSTER var).
#      Without this, Langfuse v3 migrations emit `ON CLUSTER default ...
#      Engine=ReplicatedMergeTree` → demands ZooKeeper → crashes. With it
#      false, migrations use plain MergeTree (single-node, no ZooKeeper).
#   2. CLICKHOUSE_URL uses http://...:8123 (HTTP interface), not
#      clickhouse:// native protocol. The migration URL stays native (9000).
#   3. ENCRYPTION_KEY is required by v3 (was absent → crash).
#   4. MinIO + langfuse-worker are required by v3 for event ingestion.
#
# Every graph.astream() call is traced:
#   - Each thread_id = one Langfuse session
#   - Each LLM call / tool use / subagent spawn = a span
#   - Tagged by org + transport for UI filtering
#
# Usage:
#   docker compose -f docker-compose.langfuse.yml up -d
#
# Access:
#   http://localhost:18880  (or http://langfuse.local:18880 via /etc/hosts)

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:18880}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/langfuse
  SALT: ${LANGFUSE_SALT:-baae6a9eca21b37d}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-5dd31b978154878446c7843b2b1fa41f4b7bcabdf9d53a483f5291893e08956d}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  # --- ClickHouse ---
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_USER: ${LANGFUSE_CH_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CH_PASSWORD:-clickhouse}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  # --- Redis ---
  # REDIS_URL is read by the Next.js web app directly.
  # REDIS_CONNECTION_STRING is read by @langfuse/shared (the worker's queue
  # module). Without it the worker's ioredis client has no connection info,
  # createNewRedisInstance returns null, MonitorQueue.getInstance() returns
  # null, and the worker crash-loops with "MonitorQueue is unavailable".
  REDIS_URL: redis://langfuse-redis:6379
  REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  # --- MinIO (S3 event/media storage) ---
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

services:
  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - langfuse-net

  langfuse-redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - langfuse-net

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server
    container_name: langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CH_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CH_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    networks:
      - langfuse-net

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 1s
    networks:
      - langfuse-net

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      <<: *langfuse-env
    networks:
      - langfuse-net

  langfuse:
    image: langfuse/langfuse:3
    container_name: langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-worker:
        condition: service_started
    ports:
      - "0.0.0.0:18880:3000"
    environment:
      <<: *langfuse-env
      # Force Next.js to bind 0.0.0.0:3000 — by default Docker sets HOSTNAME to
      # the container hostname, and Next.js binds ONLY to that IP (e.g.
      # 10.100.28.7:3000). That breaks the health check (127.0.0.1:3000) and
      # means the port mapping only works via Docker's IP forwarding, not from
      # inside the container.
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-a143d814e9a7b28a1bfd76571de8bccf}
      # --- Bootstrap admin + project (created on first boot) ---
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_PASSWORD:-admin123}
      LANGFUSE_INIT_ORG_ID: orchestrator
      LANGFUSE_INIT_ORG_NAME: "Pux"
      LANGFUSE_INIT_PROJECT_ID: orchestrator-threads
      LANGFUSE_INIT_PROJECT_NAME: "orchestrator-threads"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-init-public}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-init-secret}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://127.0.0.1:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - langfuse-net

volumes:
  langfuse-db-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:

networks:
  langfuse-net:
    driver: bridge
