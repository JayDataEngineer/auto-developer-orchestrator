[project]
name = "pux-agentkit"
version = "0.1.0"
description = "Standalone org + skill compiler — turn a folder of org+skills into a deepagents agent, no Docker harness required."
requires-python = ">=3.12,<3.14"
# Slim on purpose: a different project (e.g. Wan2GP + CopilotKit) depends on this
# WITHOUT dragging in the pux Docker sandbox, the ACP/server/TUI surface, or the
# browser/vision stack. deepagents ships its own FilesystemBackend/StateBackend, so
# the kit needs no execution backend of its own.
dependencies = [
    "deepagents",
    "langchain-openai",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pux_agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
