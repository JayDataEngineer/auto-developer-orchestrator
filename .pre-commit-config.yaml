# pre-commit hooks for Auto-Developer Orchestrator
#
# Install:    make hooks   (or: pre-commit install)
# Manual run: pre-commit run --all-files
#
# First run of pre-commit will compile gitleaks from source (language: golang).
# Cached afterwards. To skip on a specific commit: git commit --no-verify
# (CI will still catch it on PRs).

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args:
          - --config=.gitleaks.toml
          - --redact
