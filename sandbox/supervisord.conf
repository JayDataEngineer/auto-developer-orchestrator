[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_RESOLUTION)s
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb-error.log

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox-error.log

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -nopw -rfbport 5900 -shared
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc-error.log

[program:chrome]
command=/usr/bin/google-chrome-stable --no-first-run --no-default-browser-check --disable-gpu --no-sandbox --disable-dev-shm-usage --remote-debugging-port=%(ENV_CHROME_REMOTE_DEBUGGING_PORT)s --user-data-dir=/tmp/chrome-profile --window-size=1280,720 "data:text/html,<h1>Sandbox Ready</h1>"
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome-error.log

[program:socat-cdp]
command=bash -c "sleep 3 && socat TCP-LISTEN:19222,fork,bind=0.0.0.0 TCP:127.0.0.1:9222"
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/socat-cdp.log
stderr_logfile=/var/log/supervisor/socat-cdp-error.log

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc %(ENV_NOVNC_PORT)s localhost:5900
autorestart=true
priority=60
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc-error.log
