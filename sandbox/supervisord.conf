[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_RESOLUTION)s -ac +extension RANDR
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb-error.log

[program:setup-display]
command=bash /usr/local/bin/setup-display.sh %(ENV_DISPLAY)s 1280 720
autorestart=false
startsecs=0
startretries=0
priority=15
stdout_logfile=/var/log/supervisor/setup-display.log
stderr_logfile=/var/log/supervisor/setup-display-error.log

[program:gen-apps-menu]
command=bash -c "/usr/local/bin/fluxbox-apps-menu.sh && exit 0"
autorestart=false
startsecs=0
startretries=0
priority=19
stdout_logfile=/var/log/supervisor/gen-apps-menu.log
stderr_logfile=/var/log/supervisor/gen-apps-menu-error.log

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox-error.log

[program:pcmanfm-desktop]
command=pcmanfm --desktop
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=21
stdout_logfile=/var/log/supervisor/pcmanfm-desktop.log
stderr_logfile=/var/log/supervisor/pcmanfm-desktop-error.log

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -nopw -rfbport 5900 -shared -xrandr
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc-error.log

[program:chrome]
command=/usr/bin/google-chrome-stable --no-first-run --no-default-browser-check --disable-gpu --no-sandbox --disable-dev-shm-usage --remote-debugging-port=%(ENV_CHROME_REMOTE_DEBUGGING_PORT)s --user-data-dir=/tmp/chrome-profile --window-size=1280,720 --enable-features=WebContentsForceDark about:blank
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=false
priority=40
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome-error.log

[program:socat-cdp]
command=bash -c "sleep 3 && socat TCP-LISTEN:19222,fork,bind=0.0.0.0 TCP:127.0.0.1:9222"
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/socat-cdp.log
stderr_logfile=/var/log/supervisor/socat-cdp-error.log

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc %(ENV_NOVNC_PORT)s localhost:5900
autorestart=true
priority=60
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc-error.log

[program:sb-server]
command=python3 /usr/local/bin/sb_server.py
environment=DISPLAY="%(ENV_DISPLAY)s",SB_SERVER_PORT="9876"
autorestart=true
priority=70
stdout_logfile=/var/log/supervisor/sb-server.log
stderr_logfile=/var/log/supervisor/sb-server-error.log
