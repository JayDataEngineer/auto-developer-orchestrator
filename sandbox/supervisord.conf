[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_RESOLUTION)s -ac +extension RANDR
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb-error.log

[program:setup-display]
command=bash /usr/local/bin/setup-display.sh %(ENV_DISPLAY)s 1280 720
autorestart=false
startsecs=0
startretries=0
priority=15
stdout_logfile=/var/log/supervisor/setup-display.log
stderr_logfile=/var/log/supervisor/setup-display-error.log

[program:egress-firewall]
# Applies deny-by-default iptables rules from /sandbox/workspace/.pux/egress.conf
# when staged by the Go server (only happens when orgs/<name>/policy.yaml
# declares an egress.allow block). No conf file = no-op exit. Runs once at
# boot — autorestart=false so the firewall survives the script exiting.
command=bash /usr/local/bin/apply-egress-policy.sh
autorestart=false
startsecs=0
startretries=0
priority=15
stdout_logfile=/var/log/supervisor/egress-firewall.log
stderr_logfile=/var/log/supervisor/egress-firewall-error.log

[program:egress-dns-refresh]
# Periodic re-resolution of DNS-based allowlist entries. CDNs rotate IPs
# (Cloudflare, fastly, AWS) and the boot-time resolution becomes stale —
# without refresh, the firewall allows dead IPs and drops live ones, and
# the agent sees mysterious timeouts hours into a session. Loop wrapper
# sleeps 5min + calls refresh-egress-dns.sh, which re-resolves each
# `# host:` block in egress.conf, atomically replaces the file, then
# re-applies iptables. Failures are non-fatal to the loop. Only does
# work when egress.conf exists (no-op otherwise).
command=bash /usr/local/bin/egress-dns-refresh-loop.sh
autorestart=true
startsecs=0
priority=16
stdout_logfile=/var/log/supervisor/egress-refresh.log
stderr_logfile=/var/log/supervisor/egress-refresh-error.log

[program:gen-apps-menu]
command=bash -c "/usr/local/bin/fluxbox-apps-menu.sh && exit 0"
autorestart=false
startsecs=0
startretries=0
priority=19
stdout_logfile=/var/log/supervisor/gen-apps-menu.log
stderr_logfile=/var/log/supervisor/gen-apps-menu-error.log

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox-error.log

[program:pcmanfm-desktop]
command=pcmanfm --desktop
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=21
stdout_logfile=/var/log/supervisor/pcmanfm-desktop.log
stderr_logfile=/var/log/supervisor/pcmanfm-desktop-error.log

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -nopw -rfbport 5900 -shared -xrandr
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc-error.log

[program:chrome]
command=/usr/bin/google-chrome-stable --no-first-run --no-default-browser-check --disable-gpu --no-sandbox --disable-dev-shm-usage --remote-debugging-port=%(ENV_CHROME_REMOTE_DEBUGGING_PORT)s --user-data-dir=/tmp/chrome-profile --window-size=1280,720 --enable-features=WebContentsForceDark about:blank
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=false
priority=40
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome-error.log

[program:socat-cdp]
command=bash -c "sleep 3 && socat TCP-LISTEN:19222,fork,bind=0.0.0.0 TCP:127.0.0.1:9222"
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/socat-cdp.log
stderr_logfile=/var/log/supervisor/socat-cdp-error.log

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc %(ENV_NOVNC_PORT)s localhost:5900
autorestart=true
priority=60
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc-error.log

[program:sb-server]
command=python3 /usr/local/bin/sb_server.py
environment=DISPLAY="%(ENV_DISPLAY)s",SB_SERVER_PORT="9876"
autorestart=true
priority=70
stdout_logfile=/var/log/supervisor/sb-server.log
stderr_logfile=/var/log/supervisor/sb-server-error.log

[program:seed-cookies]
# Decodes the base64 cookie JSON named by SEED_COOKIES_ENV (set by the Go
# policy hook from policy.yaml's browser.cookies_env field) and POSTs it to
# sb_server.py's /cookies endpoint. Runs once at boot — autorestart=false.
# Silent no-op exit 0 when SEED_COOKIES_ENV is unset, so orgs that don't opt
# into browser pre-seed aren't affected.
command=bash /usr/local/bin/seed-cookies.sh
autorestart=false
startsecs=0
startretries=0
priority=80
stdout_logfile=/var/log/supervisor/seed-cookies.log
stderr_logfile=/var/log/supervisor/seed-cookies-error.log
