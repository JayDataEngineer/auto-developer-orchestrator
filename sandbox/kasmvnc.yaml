network:
  protocol: http
  websocket_port: 8444
  ssl:
    require_ssl: false

desktop:
  resolution:
    width: 1280
    height: 720
  allow_resize: true

encoding:
  max_frame_rate: 30

command_line:
  prompt: false

security:
  brute_force_protection:
    blacklist_threshold: 5
    blacklist_timeout: 10
