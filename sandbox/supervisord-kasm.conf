[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# KasmVNC provides its own X server (Xkasmvnc) — no separate Xvfb needed.
# vncserver creates display :99 and serves web+websocket on port 8444.
# .de-was-selected marker suppresses "Desktop Environment not selected" warning.
# startsecs=5: give X server time to bind ports before declaring healthy.
# startretries=50 + delay: avoid port race on restart.
[program:kasmvnc]
command=/usr/local/bin/start-kasmvnc.sh 99 %(ENV_KASMVNC_PORT)s 1280x720
environment=HOME="/root",USER="root",SHELL="/bin/bash",DISPLAY=""
directory=/root
autorestart=true
startsecs=5
startretries=50
priority=10
stdout_logfile=/var/log/supervisor/kasmvnc.log
stderr_logfile=/var/log/supervisor/kasmvnc-error.log

[program:fluxbox]
command=bash -c "sleep 3 && /usr/bin/fluxbox"
environment=DISPLAY=":99"
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox-error.log

[program:chrome]
command=bash -c "sleep 5 && /usr/bin/google-chrome-stable --no-first-run --no-default-browser-check --disable-gpu --no-sandbox --disable-dev-shm-usage --remote-debugging-port=%(ENV_CHROME_REMOTE_DEBUGGING_PORT)s --user-data-dir=/tmp/chrome-profile --window-size=1280,720 'data:text/html,<h1>Sandbox Ready</h1>'"
environment=DISPLAY=":99"
autorestart=true
startsecs=3
priority=40
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome-error.log

[program:socat-cdp]
command=bash -c "sleep 6 && socat TCP-LISTEN:19222,fork,bind=0.0.0.0 TCP:127.0.0.1:9222"
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/socat-cdp.log
stderr_logfile=/var/log/supervisor/socat-cdp-error.log

[program:sb-server]
command=python3 /usr/local/bin/sb_server.py
environment=DISPLAY=":99",SB_SERVER_PORT="9876"
autorestart=true
priority=70
stdout_logfile=/var/log/supervisor/sb-server.log
stderr_logfile=/var/log/supervisor/sb-server-error.log
