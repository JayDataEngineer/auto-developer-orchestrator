[project]
name = "nitter-mcp"
version = "0.1.0"
description = "Read-only Twitter MCP server (Nitter-style tools) backed by direct Twitter GraphQL via twscrape. No Nitter binary, no Redis — just authenticated GraphQL with your cookies."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "auto-developer-orchestrator" }]
dependencies = [
    # MCP server
    "fastmcp>=3.4.0",
    # Twitter GraphQL client — handles the auth flow + query ID churn.
    # twscrape maintains the GraphQL operation hashes that twitter.com's
    # web client uses; we just supply the cookies.
    "twscrape>=0.12,<0.20",
    # HTTP (used by twscrape; pinned here for version visibility).
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
