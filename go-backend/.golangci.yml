run:
  timeout: 5m
  concurrency: 4

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - prealloc
  disable:
    - gocyclo        # not useful for agent orchestration code
    - dupl           # false positives on tool definition boilerplate
    - gochecknoglobals # config globals are intentional

linters-settings:
  govet:
    check-shadowing: true
  misspell:
    locale: US
  prealloc:
    simple: true
    range-loops: true
    for-loops: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
    - path: internal/llama/tool_defs_.*\.go
      linters:
        - dupl
        - gochecknoglobals
  max-issues-per-linter: 0
  max-same-issues: 0
